<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIPADIN — Verifikasi HRGA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #0a0f1e; }
    .glass { background: rgba(255,255,255,0.04); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
    .glass-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); }
    .gradient-text { background: linear-gradient(135deg,#38bdf8,#818cf8); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .btn-approve { background: linear-gradient(135deg,#10b981,#059669); transition: all .3s; }
    .btn-approve:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(16,185,129,.4); }
    .btn-reject  { background: linear-gradient(135deg,#ef4444,#dc2626); transition: all .3s; }
    .btn-reject:hover  { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(239,68,68,.3); }
    .btn-send { background: linear-gradient(135deg,#06b6d4,#0891b2); transition: all .3s; }
    .btn-send:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(6,182,212,.4); }
    .input-field { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; transition: .2s; }
    .input-field:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.2); }
    .input-field::placeholder { color: rgba(255,255,255,0.3); }
    .table-row { border-bottom: 1px solid rgba(255,255,255,0.05); transition: background .2s; }
    .table-row:hover { background: rgba(255,255,255,0.03); }
    .modal-overlay { background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); }
    .disabled-btn { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
    .tab-active { background: rgba(56,189,248,0.15); border-color: rgba(56,189,248,0.3); color: #38bdf8; }
    .tab-inactive { border-color: transparent; color: #64748b; }
    .tab-inactive:hover { color: #94a3b8; }
  </style>
</head>
<body class="text-white min-h-screen">
<div id="sidebarContainer"></div>
<main class="lg:ml-64 min-h-screen">
  <div class="p-6 md:p-8">
    <div class="mb-8">
      <h1 class="text-2xl font-bold text-white">Verifikasi <span class="gradient-text">HRGA</span></h1>
      <p class="text-slate-400 text-sm mt-1">Verifikasi ketersediaan fasilitas dan kirim dokumen ke Direksi</p>
    </div>

    <div id="viewOnlyBanner" class="hidden mb-5 px-4 py-3 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center gap-3">
      <i class="ph-bold ph-eye text-amber-400 text-lg"></i>
      <p class="text-amber-300 text-sm">Anda hanya memiliki akses <strong>View Only</strong> di halaman ini.</p>
    </div>

    <!-- Tabs -->
    <div class="flex gap-2 mb-5 border-b border-white/5 pb-1">
      <button onclick="switchTab('verify')" id="tab-verify"
        class="tab-active px-4 py-2 rounded-t-lg border text-sm font-medium transition-all">
        <i class="ph-bold ph-shield-check mr-1.5"></i>Antrian Verifikasi
      </button>
      <button onclick="switchTab('send')" id="tab-send"
        class="tab-inactive px-4 py-2 rounded-t-lg border text-sm font-medium transition-all">
        <i class="ph-bold ph-paper-plane-right mr-1.5"></i>Siap Dikirim
      </button>
    </div>

    <div class="glass-card rounded-2xl overflow-hidden">
      <div class="p-4 border-b border-white/5 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div id="tabDot" class="w-2 h-2 bg-blue-400 rounded-full animate-pulse"></div>
          <span id="tabLabel" class="text-slate-300 text-sm font-medium">Menunggu Verifikasi HRGA</span>
          <span id="queueCount" class="px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-300 text-xs font-medium">0</span>
        </div>
        <button onclick="loadList()" class="px-3 py-1.5 rounded-lg border border-white/10 text-slate-400 text-xs hover:bg-white/5 transition flex items-center gap-1.5">
          <i class="ph-bold ph-arrows-clockwise"></i>
        </button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="border-b border-white/10">
              <th class="text-left px-4 py-3.5 text-slate-400 font-medium">No. SPPD</th>
              <th class="text-left px-4 py-3.5 text-slate-400 font-medium">Pemohon</th>
              <th class="text-left px-4 py-3.5 text-slate-400 font-medium">Tujuan & Fasilitas</th>
              <th class="text-left px-4 py-3.5 text-slate-400 font-medium">Tanggal</th>
              <th class="text-center px-4 py-3.5 text-slate-400 font-medium">Tindakan</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="5" class="text-center py-12 text-slate-500">
              <i class="ph-bold ph-spinner-gap text-3xl mb-2 block animate-spin"></i>Memuat...
            </td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<!-- Modal Aksi -->
<div id="modalAksi" class="fixed inset-0 z-50 hidden items-center justify-center p-4 modal-overlay">
  <div class="glass border border-white/10 rounded-2xl w-full max-w-lg">
    <div class="flex items-center justify-between p-5 border-b border-white/10">
      <h2 id="modalAksiTitle" class="text-base font-bold text-white"></h2>
      <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1"><i class="ph-bold ph-x text-xl"></i></button>
    </div>
    <div class="p-5">
      <div id="modalAksiInfo" class="glass-card rounded-xl p-4 mb-4 space-y-2 text-sm"></div>
      <label class="text-xs text-slate-400 font-medium mb-1.5 block">Catatan</label>
      <textarea id="catatanInput" rows="3" class="input-field w-full rounded-xl px-3 py-2.5 text-sm resize-none" placeholder="Catatan verifikasi..."></textarea>
      <div class="flex gap-3 mt-4">
        <button onclick="closeModal()" class="flex-1 py-2.5 rounded-xl border border-white/10 text-slate-300 text-sm font-medium hover:bg-white/5 transition">Batal</button>
        <button id="btnConfirmAksi" class="flex-1 py-2.5 rounded-xl text-white text-sm font-semibold flex items-center justify-center gap-2 transition"></button>
      </div>
    </div>
  </div>
</div>

<!-- Modal WA Sent -->
<div id="modalWA" class="fixed inset-0 z-50 hidden items-center justify-center p-4 modal-overlay">
  <div class="glass border border-white/10 rounded-2xl w-full max-w-md p-6 text-center">
    <div class="w-16 h-16 rounded-2xl bg-emerald-500/20 flex items-center justify-center mx-auto mb-4">
      <i class="ph-bold ph-whatsapp-logo text-4xl text-emerald-400"></i>
    </div>
    <h2 class="text-xl font-bold text-white mb-2">Dokumen Siap Dikirim</h2>
    <p class="text-slate-400 text-sm mb-4" id="waMsg"></p>
    <a id="waLink" href="#" target="_blank"
      class="btn-send inline-flex items-center gap-2 px-6 py-3 rounded-xl text-white font-semibold text-sm mb-3 w-full justify-center">
      <i class="ph-bold ph-whatsapp-logo text-lg"></i> Buka WhatsApp
    </a>
    <button onclick="closeWAModal()" class="w-full py-2.5 rounded-xl border border-white/10 text-slate-300 text-sm hover:bg-white/5 transition">Tutup</button>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/sidebar.js"></script>
<script>
  requireAuth();
  const user = getCurrentUser();
  renderSidebar('hrga');

  const isFullAccess = user.role_sistem === 'HRGA';
  if (!isFullAccess) document.getElementById('viewOnlyBanner').classList.remove('hidden');

  let currentTab = 'verify';
  let currentAction = null;
  let currentID = null;

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tab-verify').className = tab === 'verify' ? 'tab-active px-4 py-2 rounded-t-lg border text-sm font-medium transition-all' : 'tab-inactive px-4 py-2 rounded-t-lg border text-sm font-medium transition-all';
    document.getElementById('tab-send').className   = tab === 'send'   ? 'tab-active px-4 py-2 rounded-t-lg border text-sm font-medium transition-all' : 'tab-inactive px-4 py-2 rounded-t-lg border text-sm font-medium transition-all';
    document.getElementById('tabLabel').textContent = tab === 'verify' ? 'Menunggu Verifikasi HRGA' : 'Siap Dikirim ke Direksi';
    loadList();
  }

  async function loadList() {
    const res = await api.getQueue('hrga');
    const tbody = document.getElementById('tableBody');
    if (!res?.success) { tbody.innerHTML = '<tr><td colspan="5" class="text-center py-8 text-red-400">Gagal memuat</td></tr>'; return; }
    const all = res.data || [];
    const items = currentTab === 'verify'
      ? all.filter(s => s.status_dokumen === 'pending_hrga')
      : all.filter(s => s.status_dokumen === 'ready_to_send');
    document.getElementById('queueCount').textContent = items.length;
    if (!items.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="text-center py-12 text-slate-500"><i class="ph-bold ph-check-circle text-4xl mb-2 block text-emerald-500/40"></i>Tidak ada antrian</td></tr>';
      return;
    }
    tbody.innerHTML = items.map(s => `
      <tr class="table-row">
        <td class="px-4 py-3.5"><p class="text-white text-xs font-mono">${s.no_sppd || '-'}</p></td>
        <td class="px-4 py-3.5">
          <p class="text-white text-sm font-medium">${s.pemohon?.nama_lengkap || '-'}</p>
          <p class="text-slate-500 text-xs">${s.pemohon?.kode_departemen || ''}</p>
        </td>
        <td class="px-4 py-3.5">
          <p class="text-white text-sm">${s.kota_tujuan}</p>
          <div class="flex gap-2 mt-1">
            <span class="px-2 py-0.5 rounded bg-white/5 text-slate-400 text-xs">${s.transportasi || '-'}</span>
            <span class="px-2 py-0.5 rounded bg-white/5 text-slate-400 text-xs">${s.akomodasi || '-'}</span>
          </div>
        </td>
        <td class="px-4 py-3.5">
          <p class="text-slate-300 text-xs">${formatDateShort(s.tgl_berangkat)} – ${formatDateShort(s.tgl_kembali)}</p>
          <p class="text-slate-500 text-xs">${s.durasi_hari} hari</p>
        </td>
        <td class="px-4 py-3.5">
          <div class="flex items-center justify-center gap-2">
            ${currentTab === 'verify' ? `
              <button onclick="openAksi(${s.id_sppd}, 'approve', ${JSON.stringify(s).replace(/"/g,"'")})"
                ${!isFullAccess ? 'class="disabled-btn btn-approve p-2.5 rounded-xl text-white"' : 'class="btn-approve p-2.5 rounded-xl text-white"'}>
                <i class="ph-bold ph-check text-base"></i>
              </button>
              <button onclick="openAksi(${s.id_sppd}, 'reject', ${JSON.stringify(s).replace(/"/g,"'")})"
                ${!isFullAccess ? 'class="disabled-btn btn-reject p-2.5 rounded-xl text-white"' : 'class="btn-reject p-2.5 rounded-xl text-white"'}>
                <i class="ph-bold ph-x text-base"></i>
              </button>` : `
              <button onclick="sendWA(${s.id_sppd}, ${JSON.stringify(s).replace(/"/g,"'")})"
                ${!isFullAccess ? 'class="disabled-btn btn-send px-3 py-2 rounded-xl text-white text-xs flex items-center gap-1.5"' : 'class="btn-send px-3 py-2 rounded-xl text-white text-xs flex items-center gap-1.5"'}>
                <i class="ph-bold ph-whatsapp-logo text-base"></i> Kirim WA
              </button>`}
          </div>
        </td>
      </tr>`).join('');
  }

  function openAksi(id, action, data) {
    currentID = id; currentAction = action;
    const isApprove = action === 'approve';
    document.getElementById('modalAksiTitle').textContent = isApprove ? '✔ Verifikasi Fasilitas' : '✖ Tolak Pengajuan';
    document.getElementById('catatanInput').value = '';
    document.getElementById('modalAksiInfo').innerHTML = `
      <div class="flex justify-between"><span class="text-slate-500">Pemohon</span><span class="text-white font-medium">${data.pemohon?.nama_lengkap || '-'}</span></div>
      <div class="flex justify-between"><span class="text-slate-500">Tujuan</span><span class="text-white">${data.kota_tujuan}</span></div>
      <div class="flex justify-between"><span class="text-slate-500">Transportasi</span><span class="text-white">${data.transportasi || '-'}</span></div>
      <div class="flex justify-between"><span class="text-slate-500">Akomodasi</span><span class="text-white">${data.akomodasi || '-'}</span></div>`;
    const btn = document.getElementById('btnConfirmAksi');
    btn.className = `flex-1 py-2.5 rounded-xl text-white text-sm font-semibold flex items-center justify-center gap-2 transition ${isApprove ? 'btn-approve' : 'btn-reject'}`;
    btn.innerHTML = `<i class="ph-bold ${isApprove ? 'ph-check' : 'ph-x'} text-base"></i>${isApprove ? 'Ya, Verifikasi' : 'Ya, Tolak'}`;
    btn.onclick = submitAksi;
    document.getElementById('modalAksi').classList.remove('hidden');
    document.getElementById('modalAksi').classList.add('flex');
  }

  async function submitAksi() {
    const catatan = document.getElementById('catatanInput').value.trim();
    if (currentAction === 'reject' && !catatan) { showToast('Catatan penolakan wajib diisi', 'warning'); return; }
    const btn = document.getElementById('btnConfirmAksi');
    btn.disabled = true;
    const res = await api.hrgaAction(currentID, { action: currentAction, catatan });
    btn.disabled = false;
    if (!res?.success) { showToast(res?.message || 'Gagal', 'error'); return; }
    showToast(currentAction === 'approve' ? 'Fasilitas terverifikasi!' : 'Ditolak', currentAction === 'approve' ? 'success' : 'warning');
    closeModal(); loadList();
  }

  async function sendWA(id, data) {
    showConfirm(`Kirim dokumen SPPD ke WhatsApp Direksi?`, async () => {
      const res = await api.sendToDirector(id);
      if (!res?.success) { showToast(res?.message || 'Gagal mengirim', 'error'); return; }
      document.getElementById('waMsg').textContent = `Dokumen ${res.data.no_sppd} siap dikirim ke ${res.data.nama_direksi}. Klik tombol di bawah untuk membuka WhatsApp.`;
      document.getElementById('waLink').href = res.data.wa_url;
      document.getElementById('modalWA').classList.remove('hidden');
      document.getElementById('modalWA').classList.add('flex');
      loadList();
    });
  }

  function closeModal() {
    document.getElementById('modalAksi').classList.add('hidden');
    document.getElementById('modalAksi').classList.remove('flex');
  }
  function closeWAModal() {
    document.getElementById('modalWA').classList.add('hidden');
    document.getElementById('modalWA').classList.remove('flex');
  }

  loadList();
</script>
</body>
</html>
