<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIPADIN — Verifikasi Finance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <script>
    // Anti-FOUC theme initialization
    (function() {
      const saved = localStorage.getItem('sipadin_theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #f8fafc; color: #1e293b; }
    html.dark body { background: #1a2235; color: #ffffff; }
    .glass { background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); border: 1px solid rgba(226,232,240,0.8); }
    html.dark .glass { background: rgba(255,255,255,0.04); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
    .glass-card { background: #ffffff; border: 1px solid #e2e8f0; }
    html.dark .glass-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); }
    .gradient-text { background: linear-gradient(135deg,#0284c7,#10b981); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    html.dark .gradient-text { background: linear-gradient(135deg,#a78bfa,#818cf8); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .btn-approve { background: linear-gradient(135deg,#10b981,#059669); transition: all .3s; }
    .btn-approve:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(16,185,129,.4); }
    .btn-reject  { background: linear-gradient(135deg,#ef4444,#dc2626); transition: all .3s; }
    .btn-reject:hover  { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(239,68,68,.3); }
    .input-field { background: #ffffff; border: 1px solid #cbd5e1; color: #1e293b; transition: .2s; }
    html.dark .input-field { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; }
    .input-field:focus { outline: none; border-color: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,.2); }
    html.dark .input-field:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.2); }
    .input-field::placeholder { color: #94a3b8; }
    html.dark .input-field::placeholder { color: rgba(255,255,255,0.3); }
    .table-row { border-bottom: 1px solid #e2e8f0; transition: background .2s; }
    html.dark .table-row { border-bottom: 1px solid rgba(255,255,255,0.05); }
    .table-row:hover { background: #f1f5f9; }
    html.dark .table-row:hover { background: rgba(255,255,255,0.03); }
    .modal-overlay { background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
    .disabled-btn { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
    .budget-ok   { color: #10b981; font-weight: 600; }
    .budget-over { color: #ef4444; font-weight: 600; }
  </style>
</head>
<body class="min-h-screen transition-colors duration-300">
<div id="sidebarContainer"></div>
<main class="lg:ml-64 min-h-screen">
  <div class="p-6 md:p-8">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
      <div>
        <h1 class="text-2xl font-bold text-slate-800 dark:text-white">Verifikasi <span class="gradient-text">Finance</span></h1>
        <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Cek plafon anggaran divisi dan setujui estimasi biaya dinas</p>
      </div>
      <!-- Theme Toggle Button -->
      <button id="themeToggleBtn" type="button" class="p-2.5 rounded-xl border transition-all duration-300 bg-white hover:bg-slate-100 border-slate-200 text-amber-500 shadow-sm dark:bg-white/5 dark:hover:bg-white/10 dark:border-white/10 dark:text-sky-400 self-start sm:self-auto" title="Ganti Mode Tema">
        <svg class="theme-icon-sun w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 9h-1m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M12 5a7 7 0 100 14 7 7 0 000-14z" />
        </svg>
        <svg class="theme-icon-moon w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
      </button>
    </div>

    <div id="viewOnlyBanner" class="hidden mb-5 px-4 py-3 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center gap-3">
      <i class="ph-bold ph-eye text-amber-400 text-lg"></i>
      <p class="text-amber-300 text-sm">Anda hanya memiliki akses <strong>View Only</strong> di halaman ini. Tombol persetujuan dinonaktifkan.</p>
    </div>
    <div class="bg-white border border-slate-200 shadow-md rounded-xl overflow-hidden dark:bg-slate-800/90 dark:border-slate-700/80 dark:shadow-none transition-all duration-300">
      <div class="p-4 border-b border-slate-200 dark:border-slate-700/60 flex items-center justify-between bg-slate-50/50 dark:bg-slate-900/30">
        <div class="flex items-center gap-2">
          <div class="w-2.5 h-2.5 bg-violet-500 rounded-full animate-pulse"></div>
          <span class="text-slate-800 dark:text-slate-200 text-sm font-semibold">Menunggu Verifikasi Finance</span>
          <span id="queueCount" class="px-2.5 py-0.5 rounded-full bg-violet-100 text-violet-800 dark:bg-violet-500/20 dark:text-violet-300 text-xs font-semibold">0</span>
        </div>
        <button onclick="handleRefresh(this)" class="px-3.5 py-1.5 rounded-lg border border-slate-200 text-slate-700 hover:bg-slate-100 dark:border-white/10 dark:text-slate-400 text-xs dark:hover:bg-white/5 transition flex items-center gap-1.5 font-medium shadow-sm active:scale-95 cursor-pointer">
          <i class="ph-bold ph-arrows-clockwise"></i> <span>Refresh</span>
        </button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm border-collapse text-left">
          <thead class="bg-blue-50/80 border-b-2 border-blue-500 dark:bg-slate-900/60 dark:border-b-2 dark:border-emerald-500 transition-colors duration-300">
            <tr>
              <th class="px-5 py-3.5 text-xs font-semibold uppercase tracking-wider text-blue-900 dark:text-emerald-300">No. SPPD</th>
              <th class="px-5 py-3.5 text-xs font-semibold uppercase tracking-wider text-blue-900 dark:text-emerald-300">Pemohon / Divisi</th>
              <th class="px-5 py-3.5 text-xs font-semibold uppercase tracking-wider text-blue-900 dark:text-emerald-300">Tujuan</th>
              <th class="px-5 py-3.5 text-xs font-semibold uppercase tracking-wider text-blue-900 dark:text-emerald-300">Est. Biaya</th>
              <th class="px-5 py-3.5 text-xs font-semibold uppercase tracking-wider text-blue-900 dark:text-emerald-300 text-center">Tindakan</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-100 dark:divide-slate-700/50">
            <tr><td colspan="5" class="text-center py-12 text-slate-500">
              <i class="ph-bold ph-spinner-gap text-3xl mb-2 block animate-spin text-emerald-600 dark:text-indigo-400"></i>Memuat data antrian...
            </td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<!-- Modal Aksi -->
<!-- Modal Aksi -->
<div id="modalAksi" class="fixed inset-0 z-50 hidden overflow-y-auto flex justify-center items-center p-4 modal-overlay">
  <div class="bg-white border border-slate-200 dark:bg-slate-800 dark:border-white/10 rounded-2xl w-full max-w-2xl max-h-[90vh] flex flex-col shadow-2xl transition-all duration-300 my-auto">
    <!-- Header (Fixed) -->
    <div class="flex items-center justify-between p-5 border-b border-slate-200 dark:border-white/10 flex-shrink-0">
      <h2 id="modalAksiTitle" class="text-base font-bold text-slate-900 dark:text-white"></h2>
      <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-white transition p-1 cursor-pointer"><i class="ph-bold ph-x text-xl"></i></button>
    </div>
    <!-- Body (Scrollable) -->
    <div class="p-5 sm:p-6 overflow-y-auto flex-1 space-y-4">
      <div id="modalAksiInfo" class="bg-slate-50 border border-slate-200 dark:bg-slate-900/40 dark:border-slate-700 rounded-xl p-4 space-y-3 text-sm"></div>
      <div>
        <label class="text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5 block">Catatan Finance</label>
        <textarea id="catatanInput" rows="2" class="input-field w-full rounded-xl px-3 py-2 text-sm resize-none" placeholder="Catatan anggaran / persetujuan..."></textarea>
      </div>
    </div>
    <!-- Footer (Fixed) -->
    <div class="p-4 sm:p-5 border-t border-slate-200 dark:border-white/10 flex gap-3 flex-shrink-0 bg-slate-50/50 dark:bg-slate-800/80 rounded-b-2xl">
      <button onclick="closeModal()" class="flex-1 py-2.5 rounded-xl border border-slate-200 text-slate-700 dark:border-white/10 dark:text-slate-300 text-sm font-medium hover:bg-slate-100 dark:hover:bg-white/5 transition cursor-pointer active:scale-95">Batal</button>
      <button id="btnConfirmAksi" class="flex-1 py-2.5 rounded-xl text-white text-sm font-semibold flex items-center justify-center gap-2 transition shadow-lg cursor-pointer active:scale-95"></button>
    </div>
  </div>
</div>

<div id="toast" class="fixed bottom-6 right-6 z-[9999] px-5 py-3 rounded-xl glass border text-sm font-medium flex items-center gap-2.5 min-w-64 hidden">
  <i id="toastIcon" class="ph-bold text-lg"></i><span id="toastMsg"></span>
</div>

<script src="js/api.js?v=3"></script>
<script src="js/sidebar.js?v=3"></script>
<script>
  requireAuth();
  const user = getCurrentUser();
  renderSidebar('finance');

  const userRole = (user.role_sistem || '').trim().toLowerCase();
  const isFullAccess = userRole === 'finance' || isFullAccessPage('finance', user.role_sistem);
  if (!isFullAccess) document.getElementById('viewOnlyBanner').classList.remove('hidden');

  let sppdMap = {};
  let currentID = null;
  let currentAction = null;

  async function handleRefresh(btn) {
    const icon = btn?.querySelector('i');
    if (icon) icon.classList.add('animate-spin');
    await loadList();
    if (icon) setTimeout(() => icon.classList.remove('animate-spin'), 400);
    showToast('Data antrian berhasil diperbarui', 'info');
  }

  async function loadList() {
    const res = await api.getQueue('finance');
    const tbody = document.getElementById('tableBody');
    if (!res?.success) { tbody.innerHTML = '<tr><td colspan="5" class="text-center py-8 text-rose-500">Gagal memuat antrian</td></tr>'; return; }
    const items = res.data || [];
    sppdMap = {};
    items.forEach(s => { sppdMap[s.id_sppd] = s; });

    document.getElementById('queueCount').textContent = res.total || items.length;
    if (!items.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="text-center py-12 text-slate-500"><i class="ph-bold ph-check-circle text-4xl mb-2 block text-emerald-500/60"></i>Tidak ada antrian</td></tr>';
      return;
    }
    tbody.innerHTML = items.map(s => `
      <tr class="hover:bg-slate-50/80 dark:hover:bg-slate-700/30 transition-colors border-b border-slate-100 dark:border-slate-700/50">
        <td class="px-5 py-4"><p class="text-slate-900 dark:text-white text-xs font-mono font-semibold">${s.no_sppd || '-'}</p></td>
        <td class="px-5 py-4">
          <p class="text-slate-900 dark:text-white text-sm font-semibold">${s.pemohon?.nama_lengkap || '-'}</p>
          <p class="text-slate-500 dark:text-slate-400 text-xs">${s.pemohon?.kode_departemen || 'Divisi -'}</p>
        </td>
        <td class="px-5 py-4">
          <p class="text-slate-800 dark:text-slate-100 text-sm font-medium">${s.kota_tujuan}</p>
          <p class="text-slate-500 dark:text-slate-400 text-xs mt-0.5">${s.durasi_hari} hari</p>
        </td>
        <td class="px-5 py-4">
          <p class="text-base font-bold text-violet-700 dark:text-violet-300 font-mono">${formatRupiah(s.estimasi_biaya)}</p>
        </td>
        <td class="px-5 py-4 text-center">
          <div class="flex items-center justify-center gap-2">
            <button onclick="openAksi(${s.id_sppd}, 'approve')"
              title="Setujui Biaya" ${!isFullAccess ? 'class="disabled-btn"' : 'class="btn-approve cursor-pointer active:scale-90 p-2.5 rounded-xl text-white shadow-md transition-transform"'}>
              <i class="ph-bold ph-check text-base"></i>
            </button>
            <button onclick="openAksi(${s.id_sppd}, 'reject')"
              title="Tolak Biaya" ${!isFullAccess ? 'class="disabled-btn"' : 'class="btn-reject cursor-pointer active:scale-90 p-2.5 rounded-xl text-white shadow-md transition-transform"'}>
              <i class="ph-bold ph-x text-base"></i>
            </button>
          </div>
        </td>
      </tr>`).join('');
  }

  function calcRevisionTotal() {
    const m = parseFloat(document.getElementById('rev_makan')?.value) || 0;
    const t = parseFloat(document.getElementById('rev_transport')?.value) || 0;
    const u = parseFloat(document.getElementById('rev_uang_saku')?.value) || 0;
    const tk = parseFloat(document.getElementById('rev_tiket')?.value) || 0;
    const h = parseFloat(document.getElementById('rev_hotel')?.value) || 0;
    const total = m + t + u + tk + h;
    const disp = document.getElementById('rev_total_display');
    if (disp) disp.textContent = formatRupiah(total);
  }

  async function openAksi(id, action) {
    const data = sppdMap[id] || {};
    currentID = id; currentAction = action;
    const isApprove = action === 'approve';
    document.getElementById('modalAksiTitle').textContent = isApprove ? '✔ Setujui Biaya & Hak Koreksi Finance' : '✖ Tolak Biaya';
    document.getElementById('catatanInput').value = '';
    const anggotaNames = (data.anggota || []).map(a => a.user?.nama_lengkap || '').filter(Boolean).join(', ');
    const anggotaRow = anggotaNames ? `<div class="flex justify-between"><span class="text-slate-500">Rombongan</span><span class="text-indigo-300 font-medium">${anggotaNames}</span></div>` : '';

    const isExceeded = data.status_plafon === 'MELEBIHI_PLAFON';
    const plafonBadge = isExceeded
      ? `<span class="inline-flex items-center gap-1 text-[11px] font-semibold text-amber-300 bg-amber-500/15 border border-amber-500/30 px-2 py-0.5 rounded-full"><i class="ph-bold ph-warning"></i> Melebihi Plafon</span>`
      : `<span class="inline-flex items-center gap-1 text-[11px] font-semibold text-emerald-300 bg-emerald-500/15 border border-emerald-500/30 px-2 py-0.5 rounded-full"><i class="ph-bold ph-check-circle"></i> Sesuai Plafon</span>`;

    // Fetch Kalkulasi Breakdown Per Kepala
    let perKepalaRowsHTML = `<tr><td colspan="5" class="text-center py-2 text-slate-400">Memuat rincian per orang...</td></tr>`;
    let transportBersama = data.biaya_transport || 0;
    let tiketBersama = data.biaya_tiket || 0;
    let totalHitungAPI = data.estimasi_biaya || 0;

    const rekanList = (data.anggota || []).map(a => a.user?.nomor_id || a.user?.nama_lengkap || (a.id_user ? String(a.id_user) : '')).filter(Boolean);
    const hitungPayload = {
      nomor_id: data.pemohon?.nomor_id || '',
      kota_tujuan: data.kota_tujuan,
      tgl_berangkat: data.tgl_berangkat ? data.tgl_berangkat.split('T')[0] : '',
      tgl_kembali: data.tgl_kembali ? data.tgl_kembali.split('T')[0] : '',
      jam_berangkat: data.jam_berangkat || '08:00',
      jam_kembali: data.jam_kembali || '17:00',
      jarak_km: parseFloat(data.jarak_km) || 0,
      transportasi: data.transportasi || '',
      akomodasi: data.akomodasi || '',
      rekan_kerja: rekanList
    };

    try {
      const calcRes = await api.hitungBiaya(hitungPayload);
      if (calcRes && calcRes.success && calcRes.data) {
        totalHitungAPI = calcRes.data.total_keseluruhan || totalHitungAPI;
        if (calcRes.data.komponen_bersama) {
          transportBersama = calcRes.data.komponen_bersama.transport || 0;
          tiketBersama = calcRes.data.komponen_bersama.tiket || 0;
        }
        if (calcRes.data.rincian_per_kepala && calcRes.data.rincian_per_kepala.length > 0) {
          perKepalaRowsHTML = calcRes.data.rincian_per_kepala.map(r => `
            <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/40">
              <td class="py-2 px-2 text-slate-800 dark:text-slate-200">
                <div class="font-semibold text-xs">${r.nama}</div>
                <div class="text-[10px] text-slate-500">${r.role} (${r.jabatan || '-'})</div>
              </td>
              <td class="py-2 px-2 text-right text-slate-700 dark:text-slate-300 font-mono text-xs">${formatRupiah(r.makan)}</td>
              <td class="py-2 px-2 text-right text-slate-700 dark:text-slate-300 font-mono text-xs">${formatRupiah(r.saku)}</td>
              <td class="py-2 px-2 text-right text-slate-700 dark:text-slate-300 font-mono text-xs">${formatRupiah(r.hotel)}</td>
              <td class="py-2 px-2 text-right text-emerald-600 dark:text-emerald-400 font-bold font-mono text-xs">${formatRupiah(r.subtotal)}</td>
            </tr>
          `).join('');
        }
      }
    } catch (e) {
      console.error('Error calculating per-head in Finance modal:', e);
    }

    const rincianPerKepalaSection = `
      <div class="mt-4 pt-3 border-t border-slate-200 dark:border-white/10 space-y-2">
        <div class="flex items-center justify-between">
          <label class="text-xs font-bold text-slate-800 dark:text-white flex items-center gap-1.5">
            <i class="ph-bold ph-users-three text-violet-600 dark:text-violet-400"></i> Rincian Hak Per Orang (Read-Only)
          </label>
          <span class="text-[11px] text-slate-500 dark:text-slate-400 font-medium">Hak Objektif Rombongan</span>
        </div>
        <div class="overflow-x-auto rounded-xl border border-slate-200 dark:border-white/10 bg-slate-50/70 dark:bg-slate-900/60 p-2">
          <table class="w-full text-xs text-left">
            <thead>
              <tr class="text-slate-600 dark:text-slate-400 border-b border-slate-200 dark:border-white/10 font-semibold">
                <th class="py-1.5 px-2">Nama & Role</th>
                <th class="py-1.5 px-2 text-right">Makan</th>
                <th class="py-1.5 px-2 text-right">U. Saku</th>
                <th class="py-1.5 px-2 text-right">Hotel</th>
                <th class="py-1.5 px-2 text-right">Subtotal</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-200 dark:divide-white/5">
              ${perKepalaRowsHTML}
            </tbody>
          </table>
        </div>
        <div class="flex flex-wrap items-center justify-between gap-2 p-2 rounded-lg bg-slate-100 dark:bg-slate-800/60 border border-slate-200 dark:border-white/5 text-[11px]">
          <span class="text-slate-600 dark:text-slate-400">Komponen Bersama: <strong>Transport</strong> ${formatRupiah(transportBersama)} | <strong>Tiket</strong> ${formatRupiah(tiketBersama)}</span>
          <span class="text-slate-700 dark:text-slate-300 font-semibold">Kalkulasi Sistem: <strong class="text-emerald-600 dark:text-emerald-400">${formatRupiah(totalHitungAPI)}</strong></span>
        </div>
      </div>
    `;

    let costRevisionHTML = '';
    if (isApprove) {
      costRevisionHTML = `
        <div class="mt-4 pt-3 border-t border-slate-200 dark:border-white/10 space-y-3">
          <div class="flex items-center justify-between">
            <label class="text-xs font-bold text-slate-800 dark:text-white flex items-center gap-1.5">
              <i class="ph-bold ph-scales text-blue-600 dark:text-indigo-400"></i> Plafon & Hak Koreksi Anggaran Finance (Editable)
            </label>
            ${plafonBadge}
          </div>
          <div class="overflow-x-auto rounded-xl border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-slate-900/60 p-2">
            <table class="w-full text-xs text-left">
              <thead>
                <tr class="text-slate-600 dark:text-slate-400 border-b border-slate-200 dark:border-white/10 font-semibold">
                  <th class="py-1.5 px-2">Komponen</th>
                  <th class="py-1.5 px-2">Nominal SPPD</th>
                  <th class="py-1.5 px-2">Batas Plafon</th>
                  <th class="py-1.5 px-2">Koreksi Finance (Rp)</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-200 dark:divide-white/5">
                <tr>
                  <td class="py-2 px-2 text-slate-700 dark:text-slate-300 font-medium">Uang Makan</td>
                  <td class="py-2 px-2 text-slate-900 dark:text-white font-medium">${formatRupiah(data.biaya_makan || 0)}</td>
                  <td class="py-2 px-2 text-slate-500 dark:text-slate-400 font-mono">${formatRupiah(data.plafon_makan || 0)}</td>
                  <td class="py-2 px-2">
                    <input id="rev_makan" type="number" min="0" value="${data.biaya_makan || 0}" oninput="calcRevisionTotal()"
                      class="input-field w-28 rounded-lg px-2 py-1 text-xs text-slate-800 dark:text-white font-semibold" />
                  </td>
                </tr>
                <tr>
                  <td class="py-2 px-2 text-slate-700 dark:text-slate-300 font-medium">Transportasi</td>
                  <td class="py-2 px-2 text-slate-900 dark:text-white font-medium">${formatRupiah(data.biaya_transport || 0)}</td>
                  <td class="py-2 px-2 text-slate-500 dark:text-slate-400 font-mono">${formatRupiah(data.plafon_transport || 0)}</td>
                  <td class="py-2 px-2">
                    <input id="rev_transport" type="number" min="0" value="${data.biaya_transport || 0}" oninput="calcRevisionTotal()"
                      class="input-field w-28 rounded-lg px-2 py-1 text-xs text-slate-800 dark:text-white font-semibold" />
                  </td>
                </tr>
                <tr>
                  <td class="py-2 px-2 text-slate-700 dark:text-slate-300 font-medium">Uang Saku</td>
                  <td class="py-2 px-2 text-slate-900 dark:text-white font-medium">${formatRupiah(data.biaya_uang_saku || 0)}</td>
                  <td class="py-2 px-2 text-slate-500 dark:text-slate-400 font-mono">${formatRupiah(data.plafon_uang_saku || 0)}</td>
                  <td class="py-2 px-2">
                    <input id="rev_uang_saku" type="number" min="0" value="${data.biaya_uang_saku || 0}" oninput="calcRevisionTotal()"
                      class="input-field w-28 rounded-lg px-2 py-1 text-xs text-slate-800 dark:text-white font-semibold" />
                  </td>
                </tr>
                <tr>
                  <td class="py-2 px-2 text-slate-700 dark:text-slate-300 font-medium">Tiket</td>
                  <td class="py-2 px-2 text-slate-900 dark:text-white font-medium">${formatRupiah(data.biaya_tiket || 0)}</td>
                  <td class="py-2 px-2 text-slate-500 dark:text-slate-400 font-mono">${formatRupiah(data.plafon_tiket || 0)}</td>
                  <td class="py-2 px-2">
                    <input id="rev_tiket" type="number" min="0" value="${data.biaya_tiket || 0}" oninput="calcRevisionTotal()"
                      class="input-field w-28 rounded-lg px-2 py-1 text-xs text-slate-800 dark:text-white font-semibold" />
                  </td>
                </tr>
                <tr>
                  <td class="py-2 px-2 text-slate-700 dark:text-slate-300 font-medium">Hotel / Mess</td>
                  <td class="py-2 px-2 text-slate-900 dark:text-white font-medium">${formatRupiah(data.biaya_hotel || 0)}</td>
                  <td class="py-2 px-2 text-slate-500 dark:text-slate-400 font-mono">${formatRupiah(data.plafon_hotel || 0)}</td>
                  <td class="py-2 px-2">
                    <input id="rev_hotel" type="number" min="0" value="${data.biaya_hotel || 0}" oninput="calcRevisionTotal()"
                      class="input-field w-28 rounded-lg px-2 py-1 text-xs text-slate-800 dark:text-white font-semibold" />
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-100 dark:bg-white/5 border border-slate-200 dark:border-white/10">
            <span class="text-xs text-slate-600 dark:text-slate-400 font-medium">Total Biaya Setelah Koreksi Finance:</span>
            <span id="rev_total_display" class="text-sm font-bold text-emerald-600 dark:text-emerald-400">${formatRupiah(data.estimasi_biaya)}</span>
          </div>
        </div>
      `;
    }

    const lampiranRow = data.lampiran_file ? `<div class="flex justify-between items-center"><span class="text-slate-500 dark:text-slate-400">Lampiran</span><a href="${data.lampiran_file}" target="_blank" class="text-blue-600 dark:text-indigo-400 hover:underline text-xs font-semibold flex items-center gap-1"><i class="ph-bold ph-paperclip"></i> Buka Dokumen</a></div>` : '';

    document.getElementById('modalAksiInfo').innerHTML = `
      <div class="flex justify-between"><span class="text-slate-500 dark:text-slate-400">Pemohon</span><span class="text-slate-800 dark:text-white font-medium">${data.pemohon?.nama_lengkap || '-'} (${data.pemohon?.kode_departemen || '-'})</span></div>
      ${anggotaRow}
      ${lampiranRow}
      <div class="flex justify-between"><span class="text-slate-500">Tujuan & Jarak</span><span class="text-slate-800 dark:text-white font-medium">${data.kota_tujuan || '-'} ${data.jarak_km > 0 ? `(${data.jarak_km} KM)` : ''}</span></div>
      <div class="flex justify-between"><span class="text-slate-500">Tanggal & Waktu</span><span class="text-slate-800 dark:text-white font-medium">${formatDateShort(data.tgl_berangkat)} – ${formatDateShort(data.tgl_kembali)} (${data.durasi_hari} hari / ${data.durasi_jam || '-'} jam)</span></div>
      <div class="flex justify-between"><span class="text-slate-500">Jam Perjalanan</span><span class="text-slate-800 dark:text-white font-mono text-xs">${data.jam_berangkat || '08:00'} - ${data.jam_kembali || '17:00'}</span></div>
      <div class="flex justify-between"><span class="text-slate-500">Transportasi / Akomodasi</span><span class="text-slate-800 dark:text-white font-medium">${data.transportasi || '-'} / ${data.akomodasi || '-'}</span></div>
      <div class="flex justify-between"><span class="text-slate-500">Est. Biaya Awal</span><span class="text-violet-700 dark:text-violet-300 font-bold">${formatRupiah(data.estimasi_biaya)}</span></div>
      ${rincianPerKepalaSection}
      ${costRevisionHTML}`;
    const btn = document.getElementById('btnConfirmAksi');
    btn.className = `flex-1 py-2.5 rounded-xl text-white text-sm font-semibold flex items-center justify-center gap-2 cursor-pointer active:scale-95 transition ${isApprove ? 'btn-approve' : 'btn-reject'}`;
    btn.innerHTML = `<i class="ph-bold ${isApprove ? 'ph-check' : 'ph-x'} text-base"></i>${isApprove ? 'Ya, Setujui' : 'Ya, Tolak'}`;
    btn.disabled = false;
    btn.onclick = submitAksi;
    document.getElementById('modalAksi').classList.remove('hidden');
    document.getElementById('modalAksi').classList.add('flex');
  }

  async function submitAksi() {
    const catatan = document.getElementById('catatanInput').value.trim();
    if (currentAction === 'reject' && !catatan) { showToast('Catatan penolakan wajib diisi', 'warning'); return; }
    
    let payload = { action: currentAction, catatan };
    if (currentAction === 'approve') {
      const bm = parseFloat(document.getElementById('rev_makan')?.value) || 0;
      const bt = parseFloat(document.getElementById('rev_transport')?.value) || 0;
      const bu = parseFloat(document.getElementById('rev_uang_saku')?.value) || 0;
      const btk = parseFloat(document.getElementById('rev_tiket')?.value) || 0;
      const bh = parseFloat(document.getElementById('rev_hotel')?.value) || 0;
      const total = bm + bt + bu + btk + bh;
      payload.biaya_makan = bm;
      payload.biaya_transport = bt;
      payload.biaya_uang_saku = bu;
      payload.biaya_tiket = btk;
      payload.biaya_hotel = bh;
      payload.estimasi_biaya = total;
    }

    const btn = document.getElementById('btnConfirmAksi');
    btn.disabled = true;
    btn.innerHTML = `<i class="ph-bold ph-spinner animate-spin text-base"></i> Memproses...`;
    const res = await api.financeAction(currentID, payload);
    btn.disabled = false;
    if (!res?.success) {
      btn.innerHTML = `<i class="ph-bold ${currentAction === 'approve' ? 'ph-check' : 'ph-x'} text-base"></i> Coba Lagi`;
      showToast(res?.message || 'Gagal', 'error');
      return;
    }
    showToast(currentAction === 'approve' ? 'Biaya disetujui!' : 'Ditolak', currentAction === 'approve' ? 'success' : 'warning');
    closeModal(); loadList();
  }

  function closeModal() {
    document.getElementById('modalAksi').classList.add('hidden');
    document.getElementById('modalAksi').classList.remove('flex');
  }

  loadList();
</script>
</body>
</html>
