<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIPADIN — Master Tarif Fasilitas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #0a0f1e; }
    .glass { background: rgba(255,255,255,0.04); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
    .glass-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); }
    .gradient-text { background: linear-gradient(135deg,#fb923c,#f59e0b); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .btn-primary { background: linear-gradient(135deg,#6366f1,#4f46e5); transition: all .3s; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99,102,241,.4); }
    .input-field { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; transition: .2s; }
    .input-field:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.2); }
    .input-field::placeholder { color: rgba(255,255,255,0.3); }
    .table-row { border-bottom: 1px solid rgba(255,255,255,0.05); transition: background .2s; }
    .table-row:hover { background: rgba(255,255,255,0.03); }
    .modal-overlay { background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); }
    .disabled-btn { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
  </style>
</head>
<body class="text-white min-h-screen">
<div id="sidebarContainer"></div>
<main class="lg:ml-64 min-h-screen">
  <div class="p-6 md:p-8">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
      <div>
        <h1 class="text-2xl font-bold text-white">Master <span class="gradient-text">Tarif Fasilitas</span></h1>
        <p class="text-slate-400 text-sm mt-1">Referensi plafon anggaran berdasarkan area dan kriteria jabatan</p>
      </div>
      <button id="btnAdd" onclick="openModal()" class="btn-primary px-5 py-2.5 rounded-xl text-white text-sm font-semibold flex items-center gap-2 self-start sm:self-auto">
        <i class="ph-bold ph-plus"></i> Tambah Tarif
      </button>
    </div>

    <div id="viewOnlyBanner" class="hidden mb-5 px-4 py-3 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center gap-3">
      <i class="ph-bold ph-eye text-amber-400 text-lg"></i>
      <p class="text-amber-300 text-sm">Anda hanya memiliki akses <strong>View Only</strong> di halaman ini. Tombol tambah/edit/hapus dinonaktifkan.</p>
    </div>

    <div class="glass-card rounded-2xl overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="border-b border-white/10">
              <th class="text-left px-4 py-3.5 text-slate-400 font-medium">Area Tujuan</th>
              <th class="text-left px-4 py-3.5 text-slate-400 font-medium">Kriteria</th>
              <th class="text-right px-4 py-3.5 text-slate-400 font-medium">Hak Transport</th>
              <th class="text-right px-4 py-3.5 text-slate-400 font-medium">Hak Hotel/mlm</th>
              <th class="text-right px-4 py-3.5 text-slate-400 font-medium">Uang Makan/hr</th>
              <th class="text-right px-4 py-3.5 text-slate-400 font-medium">Uang Saku/hr</th>
              <th class="text-center px-4 py-3.5 text-slate-400 font-medium">Aksi</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="7" class="text-center py-12 text-slate-500">
              <i class="ph-bold ph-spinner-gap text-3xl mb-2 block animate-spin"></i>Memuat...
            </td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<!-- Modal Tambah/Edit -->
<div id="modalTarif" class="fixed inset-0 z-50 hidden items-center justify-center p-4 modal-overlay">
  <div class="glass border border-white/10 rounded-2xl w-full max-w-lg">
    <div class="flex items-center justify-between p-5 border-b border-white/10">
      <h2 id="modalTitle" class="text-base font-bold text-white">Tambah Data Tarif</h2>
      <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1"><i class="ph-bold ph-x text-xl"></i></button>
    </div>
    <form id="tarifForm" class="p-5 space-y-4">
      <input type="hidden" id="editId" />
      <div class="grid grid-cols-2 gap-4">
        <div class="col-span-2">
          <label class="text-xs text-slate-400 mb-1.5 block font-medium">Area Tujuan *</label>
          <input id="f_area" type="text" class="input-field w-full rounded-xl px-3 py-2.5 text-sm" placeholder="Contoh: Area 1 (Jatim)" required />
        </div>
        <div class="col-span-2">
          <label class="text-xs text-slate-400 mb-1.5 block font-medium">Kriteria Jabatan *</label>
          <input id="f_kriteria" type="text" class="input-field w-full rounded-xl px-3 py-2.5 text-sm" placeholder="Contoh: Grade A" required />
        </div>
        <div>
          <label class="text-xs text-slate-400 mb-1.5 block font-medium">Hak Transport (Rp)</label>
          <input id="f_transport" type="number" min="0" class="input-field w-full rounded-xl px-3 py-2.5 text-sm" placeholder="0" />
        </div>
        <div>
          <label class="text-xs text-slate-400 mb-1.5 block font-medium">Hak Hotel/mlm (Rp)</label>
          <input id="f_hotel" type="number" min="0" class="input-field w-full rounded-xl px-3 py-2.5 text-sm" placeholder="0" />
        </div>
        <div>
          <label class="text-xs text-slate-400 mb-1.5 block font-medium">Uang Makan/hari (Rp)</label>
          <input id="f_makan" type="number" min="0" class="input-field w-full rounded-xl px-3 py-2.5 text-sm" placeholder="0" />
        </div>
        <div>
          <label class="text-xs text-slate-400 mb-1.5 block font-medium">Uang Saku/hari (Rp)</label>
          <input id="f_saku" type="number" min="0" class="input-field w-full rounded-xl px-3 py-2.5 text-sm" placeholder="0" />
        </div>
      </div>
      <div class="flex gap-3 pt-2">
        <button type="button" onclick="closeModal()" class="flex-1 py-2.5 rounded-xl border border-white/10 text-slate-300 text-sm font-medium hover:bg-white/5 transition">Batal</button>
        <button type="submit" class="flex-1 btn-primary py-2.5 rounded-xl text-white text-sm font-semibold">Simpan</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/sidebar.js"></script>
<script>
  requireAuth();
  const user = getCurrentUser();
  renderSidebar('tarif');

  const isFullAccess = user.role_sistem === 'HRGA';
  if (!isFullAccess) {
    document.getElementById('viewOnlyBanner').classList.remove('hidden');
    document.getElementById('btnAdd').classList.add('disabled-btn');
  }

  async function loadList() {
    const res = await api.getAllTarif();
    const tbody = document.getElementById('tableBody');
    if (!res?.success || !res.data?.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-center py-12 text-slate-500">Belum ada data tarif</td></tr>';
      return;
    }
    tbody.innerHTML = res.data.map(t => `
      <tr class="table-row">
        <td class="px-4 py-3.5"><p class="text-white text-sm font-medium">${t.area_tujuan}</p></td>
        <td class="px-4 py-3.5"><span class="px-2 py-1 rounded-lg bg-orange-500/15 text-orange-300 text-xs font-medium border border-orange-500/20">${t.kriteria_jabatan}</span></td>
        <td class="px-4 py-3.5 text-right text-slate-300 text-sm">${formatRupiah(t.hak_transport)}</td>
        <td class="px-4 py-3.5 text-right text-slate-300 text-sm">${formatRupiah(t.hak_hotel)}</td>
        <td class="px-4 py-3.5 text-right text-slate-300 text-sm">${formatRupiah(t.tarif_uang_makan)}</td>
        <td class="px-4 py-3.5 text-right text-slate-300 text-sm">${formatRupiah(t.tarif_uang_saku)}</td>
        <td class="px-4 py-3.5">
          <div class="flex items-center justify-center gap-2">
            <button onclick="openEdit(${JSON.stringify(t).replace(/"/g,"'")})" title="Edit"
              class="${isFullAccess ? 'p-2 rounded-lg hover:bg-amber-500/20 text-slate-400 hover:text-amber-300 transition' : 'disabled-btn p-2 rounded-lg text-slate-600'}">
              <i class="ph-bold ph-pencil text-base"></i>
            </button>
            <button onclick="deleteTarif(${t.id_tarif})" title="Hapus"
              class="${isFullAccess ? 'p-2 rounded-lg hover:bg-red-500/20 text-slate-400 hover:text-red-300 transition' : 'disabled-btn p-2 rounded-lg text-slate-600'}">
              <i class="ph-bold ph-trash text-base"></i>
            </button>
          </div>
        </td>
      </tr>`).join('');
  }

  function openModal() {
    document.getElementById('editId').value = '';
    document.getElementById('modalTitle').textContent = 'Tambah Data Tarif';
    document.getElementById('tarifForm').reset();
    document.getElementById('modalTarif').classList.remove('hidden');
    document.getElementById('modalTarif').classList.add('flex');
  }

  function openEdit(t) {
    document.getElementById('editId').value    = t.id_tarif;
    document.getElementById('modalTitle').textContent = 'Edit Data Tarif';
    document.getElementById('f_area').value      = t.area_tujuan;
    document.getElementById('f_kriteria').value  = t.kriteria_jabatan;
    document.getElementById('f_transport').value = t.hak_transport;
    document.getElementById('f_hotel').value     = t.hak_hotel;
    document.getElementById('f_makan').value     = t.tarif_uang_makan;
    document.getElementById('f_saku').value      = t.tarif_uang_saku;
    document.getElementById('modalTarif').classList.remove('hidden');
    document.getElementById('modalTarif').classList.add('flex');
  }

  function closeModal() {
    document.getElementById('modalTarif').classList.add('hidden');
    document.getElementById('modalTarif').classList.remove('flex');
  }

  document.getElementById('tarifForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = {
      area_tujuan:      document.getElementById('f_area').value.trim(),
      kriteria_jabatan: document.getElementById('f_kriteria').value.trim(),
      hak_transport:    parseFloat(document.getElementById('f_transport').value) || 0,
      hak_hotel:        parseFloat(document.getElementById('f_hotel').value) || 0,
      tarif_uang_makan: parseFloat(document.getElementById('f_makan').value) || 0,
      tarif_uang_saku:  parseFloat(document.getElementById('f_saku').value) || 0,
    };
    const editId = document.getElementById('editId').value;
    const res = editId ? await api.updateTarif(editId, body) : await api.createTarif(body);
    if (!res?.success) { showToast(res?.message || 'Gagal menyimpan', 'error'); return; }
    showToast(editId ? 'Data tarif diperbarui' : 'Data tarif ditambahkan', 'success');
    closeModal(); loadList();
  });

  async function deleteTarif(id) {
    showConfirm('Hapus data tarif ini?', async () => {
      const res = await api.deleteTarif(id);
      if (!res?.success) { showToast(res?.message || 'Gagal', 'error'); return; }
      showToast('Data tarif dihapus', 'success');
      loadList();
    });
  }

  loadList();
</script>
</body>
</html>
