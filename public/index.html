<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIPADIN — Login</title>
  <meta name="description" content="Sistem Pengajuan Perjalanan Dinas — Login" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✈️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <script>
    // Anti-FOUC theme initialization
    (function() {
      const saved = localStorage.getItem('sipadin_theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #f8fafc; min-height: 100vh; }
    html.dark body { background: #0a0f1e; }
    .glass {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(226,232,240,0.8);
    }
    html.dark .glass {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .glow-blue { box-shadow: 0 10px 30px rgba(16,185,129,0.1); }
    html.dark .glow-blue { box-shadow: 0 0 40px rgba(99,102,241,0.3); }
    .gradient-text {
      background: linear-gradient(135deg, #0284c7, #10b981);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    html.dark .gradient-text {
      background: linear-gradient(135deg, #818cf8, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .btn-primary {
      background: linear-gradient(135deg, #059669, #0d9488);
      transition: all 0.3s ease;
    }
    html.dark .btn-primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(16,185,129,0.4); }
    html.dark .btn-primary:hover { box-shadow: 0 8px 30px rgba(99,102,241,0.5); }
    .btn-primary:active { transform: translateY(0); }
    .input-field {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #1e293b;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    html.dark .input-field {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: white;
    }
    .input-field:focus {
      outline: none;
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16,185,129,0.2);
    }
    html.dark .input-field:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
    }
    .input-field::placeholder { color: #94a3b8; }
    html.dark .input-field::placeholder { color: rgba(255,255,255,0.3); }
    .orbit { animation: orbit 20s linear infinite; }
    @keyframes orbit {
      from { transform: rotate(0deg) translateX(120px) rotate(0deg); }
      to   { transform: rotate(360deg) translateX(120px) rotate(-360deg); }
    }
    .float-anim { animation: floatUp 3s ease-in-out infinite; }
    @keyframes floatUp {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-12px); }
    }
    #toast {
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform: translateY(80px);
      opacity: 0;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 relative overflow-hidden transition-colors duration-300">

  <!-- Top-Right Theme Toggle Button -->
  <div class="fixed top-5 right-5 z-50">
    <button id="themeToggleBtn" type="button" class="p-2.5 rounded-xl border transition-all duration-300 bg-white hover:bg-slate-100 border-slate-200 text-amber-500 shadow-md dark:bg-white/5 dark:hover:bg-white/10 dark:border-white/10 dark:text-sky-400 cursor-pointer active:scale-95" title="Ganti Mode Tema">
      <svg class="theme-icon-sun w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 9h-1m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M12 5a7 7 0 100 14 7 7 0 000-14z" />
      </svg>
      <svg class="theme-icon-moon w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
      </svg>
    </button>
  </div>

  <!-- Background Decoration -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-emerald-500/10 dark:bg-indigo-600/10 rounded-full blur-3xl"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-sky-500/10 dark:bg-sky-600/10 rounded-full blur-3xl"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-teal-500/5 dark:bg-violet-600/5 rounded-full blur-2xl"></div>
  </div>

  <!-- Login Card -->
  <div class="glass rounded-3xl p-8 md:p-10 w-full max-w-md glow-blue relative z-10 shadow-2xl">

    <!-- Logo & Header -->
    <div class="text-center mb-6">
      <!-- Logo Container -->
      <div class="inline-flex items-center justify-center p-3.5 rounded-2xl bg-white/90 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/80 shadow-md mb-4 float-anim transition-all duration-300">
        <img src="logo-light.png" alt="Logo PT Adiprima Suraprinta" class="max-w-[200px] h-auto max-h-12 object-contain block dark:hidden" />
        <img src="logo-dark.png" alt="Logo PT Adiprima Suraprinta" class="max-w-[200px] h-auto max-h-12 object-contain hidden dark:block" />
      </div>
      <h1 class="text-2xl font-bold text-slate-800 dark:text-white mb-1">
        <span class="gradient-text">SIPADIN</span>
      </h1>
      <p class="text-slate-500 dark:text-slate-400 text-sm">Sistem Pengajuan Perjalanan Dinas</p>
      <div class="mt-2 inline-flex items-center gap-1.5 px-3 py-1 bg-emerald-500/10 dark:bg-indigo-500/10 border border-emerald-500/20 dark:border-indigo-500/20 rounded-full">
        <span id="systemStatusDot" class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span>
        <span id="systemStatusText" class="text-xs text-slate-600 dark:text-slate-400">v2.0 Online</span>
      </div>
    </div>

    <!-- Banner Notifikasi Jam Operasional -->
    <div id="operationalBanner" class="hidden mb-6 p-4 rounded-2xl border text-sm transition-all duration-300 shadow-sm">
      <div class="flex items-start gap-3">
        <div id="opBannerIconWrap" class="p-2.5 rounded-xl flex-shrink-0">
          <i id="opBannerIcon" class="ph-bold text-xl"></i>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center justify-between gap-2 mb-1">
            <h4 id="opBannerTitle" class="font-bold text-xs uppercase tracking-wider"></h4>
            <span id="opBannerBadge" class="text-[10px] font-semibold px-2 py-0.5 rounded-full border"></span>
          </div>
          <p id="opBannerMsg" class="text-xs font-semibold leading-relaxed"></p>
          <p id="opBannerDetail" class="text-[11px] mt-1.5 opacity-80 leading-normal"></p>
        </div>
      </div>
    </div>

    <!-- Form -->
    <form id="loginForm" class="space-y-5">
      <!-- Identifier (Nomor ID Karyawan) -->
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2 flex items-center justify-between">
          <span>Nomor ID Karyawan</span>
          <span class="text-[11px] font-normal text-emerald-600 dark:text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/20">5 Digit Terakhir</span>
        </label>
        <div class="relative">
          <i class="ph-bold ph-identification-card absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
          <input
            id="identifier"
            type="text"
            placeholder="Contoh: 14016 atau 29642"
            class="input-field w-full rounded-xl pl-10 pr-4 py-3 text-sm"
            autocomplete="username"
            required
          />
        </div>
        <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-1.5 flex items-center gap-1">
          <i class="ph-bold ph-info text-emerald-500"></i> Masukkan 5 digit terakhir Nomor ID dari data karyawan
        </p>
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Password</label>
        <div class="relative">
          <i class="ph-bold ph-lock-key absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
          <input
            id="password"
            type="password"
            placeholder="Masukkan password"
            class="input-field w-full rounded-xl pl-10 pr-12 py-3 text-sm"
            autocomplete="current-password"
            required
          />
          <button type="button" id="togglePassword"
            class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200 transition-colors">
            <i class="ph-bold ph-eye text-lg" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <!-- Submit -->
      <button
        id="loginBtn"
        type="submit"
        class="btn-primary w-full py-3.5 rounded-xl text-white font-semibold text-sm flex items-center justify-center gap-2 cursor-pointer"
      >
        <i id="loginBtnIcon" class="ph-bold ph-sign-in text-lg"></i>
        <span id="loginBtnText">Masuk ke Sistem</span>
      </button>
    </form>

    <!-- Footer -->
    <p class="text-center text-xs text-slate-500 dark:text-slate-400 mt-6">
      Sistem Perjalanan Dinas Internal &copy; 2026
    </p>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-xl glass border text-sm font-medium flex items-center gap-2.5 min-w-64 max-w-md shadow-2xl">
    <i id="toastIcon" class="ph-bold text-lg"></i>
    <span id="toastMsg" class="leading-snug"></span>
  </div>

  <script>
    const BASE_PATH = window.location.pathname.startsWith('/perdin') ? '/perdin' : '';
    const API = `${BASE_PATH}/api`;

    // State operasional sistem
    let operationalState = {
      isOpen: true,
      message: 'Dalam jam kerja',
      isSunday: false,
      data: null
    };

    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', () => {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'ph-bold ph-eye-slash text-lg';
      } else {
        pwd.type = 'password';
        icon.className = 'ph-bold ph-eye text-lg';
      }
    });

    // Toast
    function showToast(msg, type = 'error', duration = 4500) {
      const toast = document.getElementById('toast');
      const icon  = document.getElementById('toastIcon');
      const msgEl = document.getElementById('toastMsg');
      msgEl.textContent = msg;
      if (type === 'error') {
        toast.className = toast.className.replace(/border-\S+/g, '');
        toast.style.borderColor = 'rgba(239,68,68,0.5)';
        icon.className = 'ph-bold ph-x-circle text-lg text-red-500';
      } else {
        toast.style.borderColor = 'rgba(34,197,94,0.5)';
        icon.className = 'ph-bold ph-check-circle text-lg text-emerald-500';
      }
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), duration);
    }

    // Cek status jam operasional saat pertama buka halaman login
    async function checkOperationalStatus() {
      // Cek notifikasi logout otomatis dari sesi sebelumnya (jika auto-logout)
      const autoLogoutMsg = sessionStorage.getItem('operational_logout_msg');
      if (autoLogoutMsg) {
        sessionStorage.removeItem('operational_logout_msg');
        showToast(autoLogoutMsg, 'error', 6000);
      }

      try {
        const deviceTimeISO = new Date().toISOString();
        const res = await fetch(`${API}/auth/operational-status?client_time=${encodeURIComponent(deviceTimeISO)}`, {
          headers: { 'X-Client-Time': deviceTimeISO }
        });
        const json = await res.json();
        if (!json.success || !json.data) return;

        const data = json.data;
        operationalState.isOpen = data.is_open;
        operationalState.message = data.message;
        operationalState.isSunday = data.is_sunday;
        operationalState.data = data;

        const banner = document.getElementById('operationalBanner');
        const iconWrap = document.getElementById('opBannerIconWrap');
        const icon = document.getElementById('opBannerIcon');
        const title = document.getElementById('opBannerTitle');
        const badge = document.getElementById('opBannerBadge');
        const msg = document.getElementById('opBannerMsg');
        const detail = document.getElementById('opBannerDetail');
        const loginBtn = document.getElementById('loginBtn');
        const loginBtnIcon = document.getElementById('loginBtnIcon');
        const loginBtnText = document.getElementById('loginBtnText');
        const statusDot = document.getElementById('systemStatusDot');
        const statusText = document.getElementById('systemStatusText');

        if (!data.is_open) {
          // Sistem di luar jam kerja: hapus token agar tidak bisa auto-login
          localStorage.removeItem('sppd_token');
          localStorage.removeItem('sppd_user');

          banner.classList.remove('hidden');
          statusDot.className = 'w-1.5 h-1.5 bg-rose-500 rounded-full';
          statusText.textContent = 'Akses Ditutup';

          if (data.is_sunday) {
            // Hari Minggu
            banner.className = 'mb-6 p-4 rounded-2xl border bg-amber-500/10 border-amber-500/30 text-amber-800 dark:text-amber-200';
            iconWrap.className = 'p-2.5 rounded-xl bg-amber-500/20 text-amber-600 dark:text-amber-300';
            icon.className = 'ph-bold ph-smiley text-2xl';
            title.textContent = 'Bukan Jam Kerja';
            badge.className = 'text-[10px] font-semibold px-2.5 py-0.5 rounded-full bg-amber-500/20 text-amber-700 dark:text-amber-300 border border-amber-500/30';
            badge.textContent = 'Hari Libur';
            msg.textContent = 'bukan jam kerja, selamat istirahat 😊';
            detail.textContent = 'Akses sistem tidak tersedia pada hari Minggu. Selamat menikmati waktu istirahat!';

            loginBtn.disabled = true;
            loginBtnIcon.className = 'ph-bold ph-lock text-lg';
            loginBtnText.textContent = 'Bukan Jam Kerja 😊';
            loginBtn.classList.remove('btn-primary');
            loginBtn.classList.add('bg-slate-400', 'dark:bg-slate-700', 'opacity-60', 'cursor-not-allowed');

            showToast('bukan jam kerja, selamat istirahat 😊', 'error', 5000);
          } else if (data.message === 'Belum masuk jam kerja') {
            // Belum masuk jam kerja
            banner.className = 'mb-6 p-4 rounded-2xl border bg-sky-500/10 border-sky-500/30 text-sky-800 dark:text-sky-200';
            iconWrap.className = 'p-2.5 rounded-xl bg-sky-500/20 text-sky-600 dark:text-sky-300';
            icon.className = 'ph-bold ph-clock text-2xl';
            title.textContent = 'Belum Masuk Jam Kerja';
            badge.className = 'text-[10px] font-semibold px-2.5 py-0.5 rounded-full bg-sky-500/20 text-sky-700 dark:text-sky-300 border border-sky-500/30';
            badge.textContent = 'Belum Buka';
            msg.textContent = 'belum masuk jam kerja';
            detail.textContent = `Jam kerja hari ${data.hari} dibuka pukul ${data.jam_masuk} WIB. (Jam Device: ${data.device_time || data.current_time} WIB, Jam Server: ${data.server_time || data.current_time} WIB)`;

            loginBtn.disabled = true;
            loginBtnIcon.className = 'ph-bold ph-clock text-lg';
            loginBtnText.textContent = 'Belum Masuk Jam Kerja';
            loginBtn.classList.remove('btn-primary');
            loginBtn.classList.add('bg-slate-400', 'dark:bg-slate-700', 'opacity-60', 'cursor-not-allowed');

            showToast('belum masuk jam kerja', 'error', 5000);
          } else {
            // Sudah melewati jam kerja
            banner.className = 'mb-6 p-4 rounded-2xl border bg-rose-500/10 border-rose-500/30 text-rose-800 dark:text-rose-200';
            iconWrap.className = 'p-2.5 rounded-xl bg-rose-500/20 text-rose-600 dark:text-rose-300';
            icon.className = 'ph-bold ph-clock-countdown text-2xl';
            title.textContent = 'Jam Kerja Berakhir';
            badge.className = 'text-[10px] font-semibold px-2.5 py-0.5 rounded-full bg-rose-500/20 text-rose-700 dark:text-rose-300 border border-rose-500/30';
            badge.textContent = 'Sudah Selesai';
            msg.textContent = 'sudah melewati jam kerja';
            detail.textContent = `Jam kerja hari ${data.hari} telah berakhir pukul ${data.jam_selesai} WIB. (Jam Device: ${data.device_time || data.current_time} WIB, Jam Server: ${data.server_time || data.current_time} WIB)`;

            loginBtn.disabled = true;
            loginBtnIcon.className = 'ph-bold ph-lock text-lg';
            loginBtnText.textContent = 'Sudah Melewati Jam Kerja';
            loginBtn.classList.remove('btn-primary');
            loginBtn.classList.add('bg-slate-400', 'dark:bg-slate-700', 'opacity-60', 'cursor-not-allowed');

            showToast('sudah melewati jam kerja', 'error', 5000);
          }
        } else {
          // Dalam jam kerja
          banner.classList.add('hidden');
          statusDot.className = 'w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse';
          statusText.textContent = 'v2.0 Online';

          loginBtn.disabled = false;
          loginBtnIcon.className = 'ph-bold ph-sign-in text-lg';
          loginBtnText.textContent = 'Masuk ke Sistem';
          loginBtn.classList.add('btn-primary');
          loginBtn.classList.remove('bg-slate-400', 'dark:bg-slate-700', 'opacity-60', 'cursor-not-allowed');

          // Cek jika sudah login sebelumnya, auto redirect sesuai role
          if (localStorage.getItem('sppd_token')) {
            const user = JSON.parse(localStorage.getItem('sppd_user') || '{}');
            const redirectMap = {
              'Karyawan' : `${BASE_PATH}/dashboard.html`,
              'Manager'  : `${BASE_PATH}/manager.html`,
              'HRGA'     : `${BASE_PATH}/hrga.html`,
              'Finance'  : `${BASE_PATH}/finance.html`,
              'Direksi'  : `${BASE_PATH}/laporan.html`,
            };
            window.location.href = redirectMap[user.role_sistem] || `${BASE_PATH}/dashboard.html`;
          }
        }
      } catch (err) {
        console.warn('[Operasional] Gagal memeriksa status jam operasional:', err);
      }
    }

    // Jalankan pemeriksaan status saat halaman dibuka
    checkOperationalStatus();

    // Login Form Submit
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      // Cek proteksi frontend terlebih dahulu
      if (!operationalState.isOpen) {
        showToast(operationalState.message || 'Di luar jam kerja operasional', 'error');
        return;
      }

      const btn     = document.getElementById('loginBtn');
      const btnText = document.getElementById('loginBtnText');
      const identifier = document.getElementById('identifier').value.trim();
      const password   = document.getElementById('password').value;

      btn.disabled = true;
      btnText.textContent = 'Memverifikasi...';

      try {
        const res  = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'X-Client-Time': new Date().toISOString()
          },
          body: JSON.stringify({ 
            identifier, 
            password,
            client_time: new Date().toISOString()
          })
        });
        const data = await res.json();

        if (!data.success) {
          showToast(data.message || 'Login gagal', 'error');
          if (data.operational_closed) {
            // Perbarui status tampilan jika ditolak karena operasional
            checkOperationalStatus();
          }
          return;
        }

        localStorage.setItem('sppd_token', data.data.token);
        localStorage.setItem('sppd_user',  JSON.stringify(data.data.user));

        showToast('Login berhasil! Mengalihkan...', 'success');

        // Redirect sesuai role
        const role = data.data.user.role_sistem;
        const redirectMap = {
          'Karyawan' : `${BASE_PATH}/dashboard.html`,
          'Manager'  : `${BASE_PATH}/manager.html`,
          'HRGA'     : `${BASE_PATH}/hrga.html`,
          'Finance'  : `${BASE_PATH}/finance.html`,
          'Direksi'  : `${BASE_PATH}/laporan.html`,
        };
        setTimeout(() => {
          window.location.href = redirectMap[role] || `${BASE_PATH}/dashboard.html`;
        }, 1200);

      } catch (err) {
        showToast('Tidak dapat terhubung ke server', 'error');
      } finally {
        if (operationalState.isOpen) {
          btn.disabled = false;
          btnText.textContent = 'Masuk ke Sistem';
        }
      }
    });
  </script>
  <script src="js/theme.js"></script>
</body>
</html>
