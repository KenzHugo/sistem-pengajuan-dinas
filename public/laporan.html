<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIPADIN — Laporan & Rekapitulasi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <script>
    // Anti-FOUC theme initialization
    (function() {
      const saved = localStorage.getItem('sipadin_theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #f8fafc; color: #1e293b; }
    html.dark body { background: #1a2235; color: #ffffff; }
    .gradient-text { background: linear-gradient(135deg,#0284c7,#10b981); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    html.dark .gradient-text { background: linear-gradient(135deg,#34d399,#38bdf8); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .btn-export { background: linear-gradient(135deg,#10b981,#059669); transition: all .3s; }
    .btn-export:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(16,185,129,.3); }
    .input-field { background: #ffffff; border: 1px solid #cbd5e1; color: #1e293b; transition: .2s; }
    html.dark .input-field { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; }
    .input-field:focus { outline: none; border-color: #10b981; }
    html.dark .input-field:focus { border-color: #6366f1; }
    select.input-field option { background: #ffffff; color: #1e293b; }
    html.dark select.input-field option { background: #1e293b; color: white; }
    .rotate-180 { transform: rotate(180deg); }
  </style>
</head>
<body class="min-h-screen transition-colors duration-300">
<div id="sidebarContainer"></div>
<main class="lg:ml-64 min-h-screen">
  <div class="p-6 md:p-8">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
      <div>
        <h1 class="text-2xl font-bold text-slate-800 dark:text-white">Laporan & <span class="gradient-text">Rekapitulasi</span></h1>
        <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Audit rincian SPPD & laporan hak keuangan per personil (Klik baris untuk melihat rincian)</p>
      </div>
      <div class="flex items-center gap-3">
        <!-- Theme Toggle Button -->
        <button id="themeToggleBtn" type="button" class="p-2.5 rounded-xl border transition-all duration-300 bg-white hover:bg-slate-100 border-slate-200 text-amber-500 shadow-sm dark:bg-white/5 dark:hover:bg-white/10 dark:border-white/10 dark:text-sky-400 self-start sm:self-auto" title="Ganti Mode Tema">
          <svg class="theme-icon-sun w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 9h-1m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M12 5a7 7 0 100 14 7 7 0 000-14z" />
          </svg>
          <svg class="theme-icon-moon w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        </button>

        <button id="btnExportCSV" onclick="exportCSV()" class="btn-export px-5 py-2.5 rounded-xl text-white text-sm font-semibold flex items-center gap-2 self-start sm:self-auto shadow-lg shadow-emerald-600/20 active:scale-95 cursor-pointer">
          <i class="ph-bold ph-download-simple"></i> Export CSV (Per Personil)
        </button>
      </div>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8" id="statsGrid">
      <div class="bg-white border border-slate-200 shadow-md rounded-xl p-4 animate-pulse col-span-2 lg:col-span-1 dark:bg-slate-800/90 dark:border-slate-700/80 dark:shadow-none">
        <div class="h-4 bg-slate-200 dark:bg-white/5 rounded w-3/4 mb-3"></div>
        <div class="h-8 bg-slate-200 dark:bg-white/5 rounded w-1/2"></div>
      </div>
    </div>

    <!-- Filter & Petunjuk -->
    <div class="bg-white border border-slate-200 shadow-md rounded-xl p-4 mb-5 flex flex-wrap gap-3 items-center justify-between dark:bg-slate-800/90 dark:border-slate-700/80 dark:shadow-none transition-all duration-300">
      <div class="flex flex-wrap items-center gap-3 flex-1">
        <select id="filterStatus" onchange="loadList()" class="input-field rounded-xl px-3 py-2 text-sm flex-1 min-w-40 max-w-xs">
          <option value="">Semua Status Final</option>
          <option value="approved">Disetujui</option>
          <option value="rejected">Ditolak</option>
        </select>
        <button onclick="handleRefresh(this)" class="px-4 py-2 rounded-xl border border-slate-200 text-slate-700 hover:bg-slate-50 dark:border-white/10 dark:text-slate-300 text-sm dark:hover:bg-white/5 transition flex items-center gap-2 active:scale-95 cursor-pointer">
          <i class="ph-bold ph-arrows-clockwise"></i> <span>Refresh</span>
        </button>
      </div>
      <div class="text-xs text-slate-500 dark:text-slate-400 flex items-center gap-1.5">
        <i class="ph-bold ph-info text-blue-500"></i>
        <span>Klik baris manapun untuk membuka <strong>rincian breakdown per personil</strong>.</span>
      </div>
    </div>

    <!-- Table dengan Expandable Accordion -->
    <div class="bg-white border border-slate-200 shadow-md rounded-xl overflow-hidden dark:bg-slate-800/90 dark:border-slate-700/80 dark:shadow-none transition-all duration-300">
      <div class="overflow-x-auto">
        <table class="w-full text-sm border-collapse text-left" id="laporanTable">
          <thead class="bg-blue-50/80 border-b-2 border-blue-500 dark:bg-slate-900/60 dark:border-b-2 dark:border-emerald-500 transition-colors duration-300">
            <tr>
              <th class="text-left px-4 py-3.5 text-blue-900 dark:text-emerald-300 font-semibold uppercase text-xs tracking-wider">No. SPPD</th>
              <th class="text-left px-4 py-3.5 text-blue-900 dark:text-emerald-300 font-semibold uppercase text-xs tracking-wider">Pemohon / Tim</th>
              <th class="text-left px-4 py-3.5 text-blue-900 dark:text-emerald-300 font-semibold uppercase text-xs tracking-wider">Tujuan</th>
              <th class="text-left px-4 py-3.5 text-blue-900 dark:text-emerald-300 font-semibold uppercase text-xs tracking-wider">Tanggal</th>
              <th class="text-left px-4 py-3.5 text-blue-900 dark:text-emerald-300 font-semibold uppercase text-xs tracking-wider">Total Biaya</th>
              <th class="text-left px-4 py-3.5 text-blue-900 dark:text-emerald-300 font-semibold uppercase text-xs tracking-wider">Status</th>
              <th class="text-center px-4 py-3.5 text-blue-900 dark:text-emerald-300 font-semibold uppercase text-xs tracking-wider">Aksi</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-100 dark:divide-slate-700/50">
            <tr><td colspan="7" class="text-center py-12 text-slate-500">
              <i class="ph-bold ph-spinner-gap text-3xl mb-2 block animate-spin text-emerald-600 dark:text-indigo-400"></i>Memuat data...
            </td></tr>
          </tbody>
        </table>
      </div>
      <div class="flex items-center justify-between px-5 py-3.5 border-t border-slate-200 dark:border-slate-700/60">
        <p id="paginationInfo" class="text-slate-500 dark:text-slate-400 text-xs font-medium"></p>
        <div class="flex gap-2" id="paginationBtns"></div>
      </div>
    </div>
  </div>
</main>

<script src="js/api.js?v=3"></script>
<script src="js/sidebar.js?v=3"></script>
<script>
  requireAuth();
  const user = getCurrentUser();
  renderSidebar('laporan');

  let currentPage = 1;
  let totalData = 0;
  const LIMIT = 15;
  let allData = [];
  const ledgerCache = new Map();

  async function handleRefresh(btn) {
    const icon = btn?.querySelector('i');
    if (icon) icon.classList.add('animate-spin');
    await Promise.all([loadStats(), loadList()]);
    if (icon) setTimeout(() => icon.classList.remove('animate-spin'), 400);
    showToast('Data laporan berhasil diperbarui', 'info');
  }

  async function loadStats() {
    const res = await api.getAllList({ limit: 1000 });
    if (!res?.success) return;
    const items = res.data || [];
    const approved = items.filter(s => s.status_dokumen === 'approved');
    const rejected = items.filter(s => s.status_dokumen === 'rejected');
    const totalBiaya = approved.reduce((sum, s) => sum + (s.estimasi_biaya || 0), 0);
    const cards = [
      { label: 'Total Disetujui', val: approved.length,    icon: 'ph-check-circle',   color: 'text-emerald-600 dark:text-emerald-400', bg: 'bg-emerald-500/10' },
      { label: 'Total Ditolak',   val: rejected.length,    icon: 'ph-x-circle',       color: 'text-rose-600 dark:text-rose-400',     bg: 'bg-rose-500/10' },
      { label: 'Total Semua',     val: items.length,       icon: 'ph-files',          color: 'text-blue-600 dark:text-indigo-400',  bg: 'bg-blue-500/10' },
      { label: 'Total Biaya',     val: formatRupiah(totalBiaya), icon: 'ph-currency-dollar', color: 'text-indigo-600 dark:text-violet-400', bg: 'bg-indigo-500/10', isText: true },
    ];
    document.getElementById('statsGrid').innerHTML = cards.map(c => `
      <div class="bg-white border border-slate-200 shadow-md rounded-xl p-4 dark:bg-slate-800/90 dark:border-slate-700/80 dark:shadow-none transition-all duration-300">
        <div class="flex items-center gap-3 mb-3">
          <div class="${c.bg} w-9 h-9 rounded-xl flex items-center justify-center">
            <i class="ph-bold ${c.icon} ${c.color} text-base"></i>
          </div>
          <p class="text-slate-500 dark:text-slate-400 text-xs font-medium">${c.label}</p>
        </div>
        <p class="font-bold text-slate-800 dark:text-white ${c.isText ? 'text-base' : 'text-3xl'}">${c.val}</p>
      </div>`).join('');
  }

  async function loadList() {
    ledgerCache.clear();
    const status = document.getElementById('filterStatus').value;
    const res = await api.getQueue('laporan');
    const tbody = document.getElementById('tableBody');
    if (!res?.success) { tbody.innerHTML = '<tr><td colspan="7" class="text-center py-8 text-rose-500">Gagal memuat data</td></tr>'; return; }
    let items = res.data || [];
    if (status) items = items.filter(s => s.status_dokumen === status);
    allData = items;
    totalData = items.length;
    const start = (currentPage - 1) * LIMIT;
    const pageItems = items.slice(start, start + LIMIT);
    if (!pageItems.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-center py-12 text-slate-500"><i class="ph-bold ph-chart-bar text-4xl mb-2 block"></i>Belum ada data laporan</td></tr>';
      renderPagination();
      return;
    }

    tbody.innerHTML = pageItems.map(s => {
      const anggotaNames = (s.anggota || []).map(a => a.user?.nama_lengkap || '').filter(Boolean).join(', ');
      const rombonganBadge = anggotaNames ? `<div class="mt-1 text-blue-600 dark:text-indigo-400 text-xs flex items-center gap-1 font-medium"><i class="ph-bold ph-users"></i> +${s.anggota.length} Rekan (${anggotaNames})</div>` : '';
      
      const stBtn = s.status_dokumen === 'approved'
        ? `<a href="cetak_surat_tugas.html?id=${s.id_sppd}" target="_blank" onclick="event.stopPropagation()"
             class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-700 active:scale-95 text-white text-xs font-semibold shadow-sm transition" title="Lihat Surat Tugas">
             <i class="ph-bold ph-file-text"></i>
             <span>Lihat ST</span>
           </a>`
        : `<span class="text-slate-400 text-xs">-</span>`;

      return `
      <!-- BARIS PERTAMA (Main Row - Clickable Accordion) -->
      <tr class="cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800/70 transition border-b border-slate-100 dark:border-slate-800" onclick="toggleDetail(this, '${s.id_sppd}')">
        <td class="px-4 py-3.5">
          <div class="flex items-center gap-2">
            <i class="ph-bold ph-caret-down text-slate-400 transition-transform duration-300 accordion-icon"></i>
            <p class="text-slate-800 dark:text-white text-xs mono font-bold">${s.no_sppd || '-'}</p>
          </div>
        </td>
        <td class="px-4 py-3.5">
          <p class="text-slate-900 dark:text-white text-sm font-semibold">${s.pemohon?.nama_lengkap || '-'}</p>
          <p class="text-slate-500 dark:text-slate-400 text-xs">${s.pemohon?.kode_departemen || ''}</p>
          ${rombonganBadge}
        </td>
        <td class="px-4 py-3.5">
          <p class="text-slate-800 dark:text-white text-sm font-medium">${s.kota_tujuan}</p>
          <p class="text-slate-500 dark:text-slate-400 text-xs truncate max-w-48">${s.instansi_tujuan}</p>
        </td>
        <td class="px-4 py-3.5">
          <p class="text-slate-700 dark:text-slate-300 text-xs font-medium">${formatDateShort(s.tgl_berangkat)}</p>
          <p class="text-slate-500 dark:text-slate-400 text-xs">${s.durasi_hari} hari</p>
        </td>
        <td class="px-4 py-3.5">
          <p class="text-slate-900 dark:text-white text-sm font-bold font-mono">${formatRupiah(s.estimasi_biaya)}</p>
          ${s.status_plafon === 'MELEBIHI_PLAFON' ? '<span class="inline-block mt-0.5 text-[10px] text-amber-700 bg-amber-50 dark:text-amber-300 dark:bg-amber-500/10 px-1.5 py-0.5 rounded border border-amber-300 dark:border-amber-500/20 font-medium">Melebihi Plafon</span>' : ''}
        </td>
        <td class="px-4 py-3.5">${statusBadge(s.status_dokumen)}</td>
        <td class="px-4 py-3.5 text-center" onclick="event.stopPropagation()">
          ${stBtn}
        </td>
      </tr>

      <!-- BARIS KEDUA (Detail Row - Expandable Panel) -->
      <tr id="detail-row-${s.id_sppd}" class="hidden bg-slate-50/50 dark:bg-slate-950/40">
        <td colspan="7" class="p-0 border-b border-slate-200 dark:border-slate-700/60">
          <div class="p-4 bg-slate-50 dark:bg-slate-900 border-x border-b border-slate-200 dark:border-slate-700 rounded-b-lg shadow-inner" id="detail-content-${s.id_sppd}">
            <div class="py-6 text-center text-slate-400 font-medium animate-pulse flex items-center justify-center gap-2">
              <i class="ph-bold ph-spinner-gap text-lg animate-spin text-blue-600"></i>
              <span>Memuat rincian buku besar keuangan...</span>
            </div>
          </div>
        </td>
      </tr>
      `;
    }).join('');
    renderPagination();
  }

  function renderPagination() {
    const totalPages = Math.ceil(totalData / LIMIT);
    document.getElementById('paginationInfo').textContent = `Menampilkan ${Math.min((currentPage-1)*LIMIT+1,totalData)}–${Math.min(currentPage*LIMIT,totalData)} dari ${totalData} data`;
    document.getElementById('paginationBtns').innerHTML = `
      <button onclick="goPage(${currentPage-1})" ${currentPage<=1?'disabled':''} class="px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600 dark:border-white/10 dark:text-slate-400 text-xs disabled:opacity-30 hover:bg-slate-100 dark:hover:bg-white/5 transition">
        <i class="ph-bold ph-caret-left"></i>
      </button>
      <span class="px-3 py-1.5 text-xs text-slate-600 dark:text-slate-400 font-medium">${currentPage}/${totalPages||1}</span>
      <button onclick="goPage(${currentPage+1})" ${currentPage>=totalPages?'disabled':''} class="px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600 dark:border-white/10 dark:text-slate-400 text-xs disabled:opacity-30 hover:bg-slate-100 dark:hover:bg-white/5 transition">
        <i class="ph-bold ph-caret-right"></i>
      </button>`;
  }

  function goPage(p) { if(p>=1) { currentPage=p; loadList(); } }

  // ── LOGIKA JAVASCRIPT: TOGGLE DETAIL (FETCH ON CLICK) ────────────────────────
  async function toggleDetail(rowEl, id) {
    const detailRow = document.getElementById(`detail-row-${id}`);
    const contentBox = document.getElementById(`detail-content-${id}`);
    const icon = rowEl.querySelector('.accordion-icon');

    if (!detailRow) return;

    // Toggle tampilan hidden
    const isHidden = detailRow.classList.contains('hidden');
    if (isHidden) {
      detailRow.classList.remove('hidden');
      if (icon) icon.classList.add('rotate-180', 'text-blue-600');
    } else {
      detailRow.classList.add('hidden');
      if (icon) icon.classList.remove('rotate-180', 'text-blue-600');
      return;
    }

    // WAJIB: Kosongkan container sebelum memuat data agar tidak terjadi duplikasi elemen
    contentBox.innerHTML = `
      <div class="py-6 text-center text-slate-400 font-medium animate-pulse flex items-center justify-center gap-2">
        <i class="ph-bold ph-spinner-gap text-lg animate-spin text-blue-600"></i>
        <span>Memuat rincian buku besar keuangan...</span>
      </div>
    `;

    // Jika data detail sudah ada di cache, tidak perlu fetch ulang
    if (ledgerCache.has(id)) {
      renderDetailContent(contentBox, ledgerCache.get(id));
      return;
    }

    // Fetch data ledger detail dari backend
    try {
      let res;
      if (typeof api !== 'undefined' && typeof api.getFinanceLedger === 'function') {
        res = await api.getFinanceLedger(id);
      } else if (typeof apiFetch === 'function') {
        res = await apiFetch(`/finance/sppd-ledger/${id}`);
      } else {
        const token = localStorage.getItem('sppd_token');
        const fRes = await fetch(`${API_BASE}/finance/sppd-ledger/${id}`, {
          headers: {
            'Content-Type': 'application/json',
            ...(token ? { 'Authorization': `Bearer ${token}` } : {})
          }
        });
        res = await fRes.json();
      }

      if (!res?.success || !res?.data) {
        contentBox.innerHTML = `<div class="p-4 text-center text-rose-500 font-semibold text-xs">Gagal memuat rincian data buku besar: ${res?.message || 'Data tidak ditemukan'}</div>`;
        return;
      }
      ledgerCache.set(id, res.data);
      renderDetailContent(contentBox, res.data);
    } catch (err) {
      console.error('Gagal fetch ledger detail:', err);
      contentBox.innerHTML = `<div class="p-4 text-center text-rose-500 font-semibold text-xs">Terjadi kesalahan: ${err.message || err}</div>`;
    }
  }

  // Render desain panel rincian yang rapi di dalam baris expandable
  function renderDetailContent(container, d) {
    if (!container) return;
    container.innerHTML = '';
    const list = d.detail_ledger || [];

    container.innerHTML = `
      <div class="space-y-4">
        <!-- Bagian Atas Panel: Info Operasional Perjalanan -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 p-3 bg-white dark:bg-slate-800/80 rounded-lg border border-slate-200 dark:border-slate-700/60 text-xs">
          <div>
            <span class="text-slate-400 block mb-0.5">Tanggal Perjalanan</span>
            <p class="font-semibold text-slate-800 dark:text-slate-200">${formatDateShort(d.tgl_berangkat)} s/d ${formatDateShort(d.tgl_kembali)}</p>
            <p class="text-[11px] text-slate-500">${d.durasi_hari} hari (${d.durasi_jam || '-'} jam)</p>
          </div>
          <div>
            <span class="text-slate-400 block mb-0.5">Tujuan & Instansi</span>
            <p class="font-semibold text-slate-800 dark:text-slate-200">${d.kota_tujuan}</p>
            <p class="text-[11px] text-slate-500 truncate">${d.instansi_tujuan || '-'}</p>
          </div>
          <div>
            <span class="text-slate-400 block mb-0.5">Fasilitas Transportasi & Hotel</span>
            <p class="font-semibold text-slate-800 dark:text-slate-200">${d.transportasi || '-'} / ${d.akomodasi || '-'}</p>
            <p class="text-[11px] text-slate-500 font-mono">Tiket: ${formatRupiah(d.biaya_tiket || 0)}</p>
          </div>
          <div>
            <span class="text-slate-400 block mb-0.5">Uraian / Deskripsi Tugas</span>
            <p class="text-slate-700 dark:text-slate-300 italic truncate" title="${d.maksud_tujuan || '-'}">${d.maksud_tujuan || '-'}</p>
          </div>
        </div>

        <!-- Bagian Bawah Panel: Sub-Tabel Keuangan Per Personil -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs font-bold text-slate-800 dark:text-slate-200 flex items-center gap-1.5">
              <i class="ph-bold ph-coins text-emerald-600"></i>
              Rincian Hak Keuangan Per Personil (${list.length} Orang)
            </span>
            <span class="text-[11px] text-slate-500">Immutable Audit Ledger</span>
          </div>

          <div class="overflow-x-auto rounded-lg border border-slate-200 dark:border-slate-700/80 bg-white dark:bg-slate-900/60">
            <table class="w-full text-xs text-left">
              <thead class="bg-slate-100 dark:bg-slate-800/90 text-slate-700 dark:text-slate-300 border-b border-slate-200 dark:border-slate-700 font-semibold">
                <tr>
                  <th class="py-2 px-3">NIP / ID</th>
                  <th class="py-2 px-3">Nama Lengkap</th>
                  <th class="py-2 px-3">Jabatan / Golongan</th>
                  <th class="py-2 px-2 text-center">Role</th>
                  <th class="py-2 px-3 text-right">Uang Makan</th>
                  <th class="py-2 px-3 text-right">Uang Saku</th>
                  <th class="py-2 px-3 text-right">Uang Hotel</th>
                  <th class="py-2 px-3 text-right text-emerald-700 dark:text-emerald-400">Subtotal</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                ${list.map(p => `
                  <tr class="hover:bg-slate-50 dark:hover:bg-white/5">
                    <td class="py-2 px-3 font-mono text-slate-600 dark:text-slate-400">${p.id_karyawan || '-'}</td>
                    <td class="py-2 px-3 font-bold text-slate-900 dark:text-white">${p.snapshot_nama || '-'}</td>
                    <td class="py-2 px-3 text-slate-700 dark:text-slate-300">${p.snapshot_jabatan || p.snapshot_grup_dinas || '-'}</td>
                    <td class="py-2 px-2 text-center">
                      <span class="px-2 py-0.5 rounded text-[10px] font-bold ${p.role_personil === 'Pemohon' ? 'bg-blue-100 text-blue-800 dark:bg-blue-900/30 dark:text-blue-300' : 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/30 dark:text-emerald-300'}">
                        ${p.role_personil}
                      </span>
                    </td>
                    <td class="py-2 px-3 text-right font-mono text-slate-700 dark:text-slate-300">${formatRupiah(p.uang_makan)}</td>
                    <td class="py-2 px-3 text-right font-mono text-slate-700 dark:text-slate-300">${formatRupiah(p.uang_saku)}</td>
                    <td class="py-2 px-3 text-right font-mono text-slate-700 dark:text-slate-300">${formatRupiah(p.uang_hotel)}</td>
                    <td class="py-2 px-3 text-right font-mono font-bold text-emerald-700 dark:text-emerald-400">${formatRupiah(p.subtotal_hak_individu)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>

          <!-- Total Footer Card -->
          <div class="mt-2.5 p-3 rounded-lg bg-slate-100 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/60 flex flex-wrap items-center justify-between gap-3 text-xs">
            <div class="flex items-center gap-4 text-slate-600 dark:text-slate-400">
              <span>Total Hak Personil: <strong class="text-slate-900 dark:text-white font-mono">${formatRupiah(d.total_hak_individu)}</strong></span>
              <span>Biaya Bersama: <strong class="text-slate-900 dark:text-white font-mono">${formatRupiah(d.total_bersama)}</strong></span>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-slate-700 dark:text-slate-300 font-semibold">Grand Total SPPD:</span>
              <span class="text-emerald-700 dark:text-emerald-400 font-mono font-bold text-sm bg-emerald-50 dark:bg-emerald-900/20 px-2 py-0.5 rounded border border-emerald-300 dark:border-emerald-800">${formatRupiah(d.estimasi_biaya_total)}</span>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  // ── Export CSV Server-side (Per Personil & Komponen Bersama) ─────────────────
  async function exportCSV() {
    const btn = document.getElementById('btnExportCSV');
    const status = document.getElementById('filterStatus').value;
    const token = getToken();

    try {
      btn.disabled = true;
      btn.innerHTML = `<i class="ph-bold ph-spinner animate-spin"></i> Mengekspor CSV...`;

      const q = status ? `?status=${encodeURIComponent(status)}` : '';
      const response = await fetch(`${API_BASE}/finance/export-csv${q}`, {
        headers: {
          'Authorization': `Bearer ${token}`
        }
      });

      if (!response.ok) {
        throw new Error('Gagal mengunduh file CSV dari server');
      }

      const blob = await response.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `SPPD_Laporan_Finance_Per_Personil_${new Date().toISOString().split('T')[0]}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.URL.revokeObjectURL(url);

      showToast('Laporan CSV per personil berhasil diekspor!', 'success');
    } catch (err) {
      console.error('Export CSV error:', err);
      showToast('Gagal mengekspor CSV', 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = `<i class="ph-bold ph-download-simple"></i> Export CSV (Per Personil)`;
    }
  }

  loadStats();
  loadList();
</script>
