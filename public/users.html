<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIPADIN — Manajemen User</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #0a0f1e; }
    .glass { background: rgba(255,255,255,0.04); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
    .glass-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); }
    .gradient-text { background: linear-gradient(135deg,#c084fc,#a78bfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .btn-primary { background: linear-gradient(135deg,#6366f1,#4f46e5); transition: all .3s; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99,102,241,.4); }
    .input-field { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; transition: .2s; }
    .input-field:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.2); }
    .input-field::placeholder { color: rgba(255,255,255,0.3); }
    select.input-field option { background: #1e293b; }
    .table-row { border-bottom: 1px solid rgba(255,255,255,0.05); transition: background .2s; }
    .table-row:hover { background: rgba(255,255,255,0.03); }
    .modal-overlay { background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); }
  </style>
</head>
<body class="text-white min-h-screen">
<div id="sidebarContainer"></div>
<main class="lg:ml-64 min-h-screen">
  <div class="p-6 md:p-8">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
      <div>
        <h1 class="text-2xl font-bold text-white">Manajemen <span class="gradient-text">User</span></h1>
        <p class="text-slate-400 text-sm mt-1">Kelola akun karyawan dan hak akses sistem</p>
      </div>
      <button onclick="openModal()" class="btn-primary px-5 py-2.5 rounded-xl text-white text-sm font-semibold flex items-center gap-2 self-start sm:self-auto">
        <i class="ph-bold ph-user-plus"></i> Tambah User
      </button>
    </div>

    <div class="glass-card rounded-2xl overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="border-b border-white/10">
              <th class="text-left px-4 py-3.5 text-slate-400 font-medium">Karyawan</th>
              <th class="text-left px-4 py-3.5 text-slate-400 font-medium">Nomor ID</th>
              <th class="text-left px-4 py-3.5 text-slate-400 font-medium">Departemen</th>
              <th class="text-left px-4 py-3.5 text-slate-400 font-medium">Role</th>
              <th class="text-left px-4 py-3.5 text-slate-400 font-medium">Status</th>
              <th class="text-center px-4 py-3.5 text-slate-400 font-medium">Aksi</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="6" class="text-center py-12 text-slate-500">
              <i class="ph-bold ph-spinner-gap text-3xl mb-2 block animate-spin"></i>Memuat...
            </td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<!-- Modal Tambah/Edit User -->
<div id="modalUser" class="fixed inset-0 z-50 hidden items-center justify-center p-4 modal-overlay">
  <div class="glass border border-white/10 rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between p-5 border-b border-white/10 sticky top-0 glass">
      <h2 id="modalTitle" class="text-base font-bold text-white">Tambah User Baru</h2>
      <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1"><i class="ph-bold ph-x text-xl"></i></button>
    </div>
    <form id="userForm" class="p-5 space-y-4">
      <input type="hidden" id="editId" />
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="text-xs text-slate-400 mb-1.5 block font-medium">Nomor ID *</label>
          <input id="f_nomor_id" type="text" class="input-field w-full rounded-xl px-3 py-2.5 text-sm" placeholder="11-12 digit" />
        </div>
        <div>
          <label class="text-xs text-slate-400 mb-1.5 block font-medium">NIK Pendek</label>
          <input id="f_nik" type="text" class="input-field w-full rounded-xl px-3 py-2.5 text-sm" placeholder="Nomor mesin" />
        </div>
        <div class="col-span-2">
          <label class="text-xs text-slate-400 mb-1.5 block font-medium">Nama Lengkap *</label>
          <input id="f_nama" type="text" class="input-field w-full rounded-xl px-3 py-2.5 text-sm" placeholder="Nama lengkap karyawan" />
        </div>
        <div>
          <label class="text-xs text-slate-400 mb-1.5 block font-medium">Kode Departemen</label>
          <input id="f_dept" type="text" class="input-field w-full rounded-xl px-3 py-2.5 text-sm" placeholder="Contoh: PROD" />
        </div>
        <div>
          <label class="text-xs text-slate-400 mb-1.5 block font-medium">Kode Jabatan</label>
          <input id="f_jabatan" type="text" class="input-field w-full rounded-xl px-3 py-2.5 text-sm" placeholder="Contoh: MGT" />
        </div>
        <div>
          <label class="text-xs text-slate-400 mb-1.5 block font-medium">Role Sistem *</label>
          <select id="f_role" class="input-field w-full rounded-xl px-3 py-2.5 text-sm">
            <option value="Karyawan">Karyawan</option>
            <option value="Manager">Manager</option>
            <option value="HRGA">HRGA</option>
            <option value="Finance">Finance</option>
            <option value="Direksi">Direksi</option>
          </select>
        </div>
        <div>
          <label class="text-xs text-slate-400 mb-1.5 block font-medium">Status</label>
          <select id="f_status" class="input-field w-full rounded-xl px-3 py-2.5 text-sm">
            <option value="1">Aktif</option>
            <option value="0">Non-aktif</option>
          </select>
        </div>
        <div class="col-span-2">
          <label class="text-xs text-slate-400 mb-1.5 block font-medium">No. WhatsApp</label>
          <input id="f_wa" type="text" class="input-field w-full rounded-xl px-3 py-2.5 text-sm" placeholder="628xxxxxxxxxx" />
        </div>
        <div class="col-span-2">
          <label class="text-xs text-slate-400 mb-1.5 block font-medium">Password <span id="pwdLabel" class="text-slate-600">(kosongkan jika tidak ingin mengubah)</span></label>
          <input id="f_pwd" type="password" class="input-field w-full rounded-xl px-3 py-2.5 text-sm" placeholder="Minimal 6 karakter" />
        </div>
      </div>
      <div class="flex gap-3 pt-2">
        <button type="button" onclick="closeModal()" class="flex-1 py-2.5 rounded-xl border border-white/10 text-slate-300 text-sm font-medium hover:bg-white/5 transition">Batal</button>
        <button type="submit" class="flex-1 btn-primary py-2.5 rounded-xl text-white text-sm font-semibold">Simpan</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/sidebar.js"></script>
<script>
  requireAuth();
  const user = getCurrentUser();
  if (user.role_sistem !== 'HRGA') {
    window.location.href = '/dashboard.html';
  }
  renderSidebar('users');

  const ROLE_COLORS = {
    'Karyawan' : 'bg-slate-500/20 text-slate-300 border-slate-500/30',
    'Manager'  : 'bg-amber-500/20  text-amber-300  border-amber-500/30',
    'HRGA'     : 'bg-blue-500/20   text-blue-300   border-blue-500/30',
    'Finance'  : 'bg-violet-500/20 text-violet-300 border-violet-500/30',
    'Direksi'  : 'bg-rose-500/20   text-rose-300   border-rose-500/30',
  };

  async function loadList() {
    const res = await api.getAllUsers();
    const tbody = document.getElementById('tableBody');
    if (!res?.success || !res.data?.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="text-center py-12 text-slate-500">Belum ada data user</td></tr>';
      return;
    }
    tbody.innerHTML = res.data.map(u => `
      <tr class="table-row">
        <td class="px-4 py-3.5">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-indigo-500/20 flex items-center justify-center flex-shrink-0">
              <i class="ph-bold ph-user text-indigo-300 text-sm"></i>
            </div>
            <div>
              <p class="text-white text-sm font-medium">${u.nama_lengkap}</p>
              <p class="text-slate-500 text-xs">${u.no_whatsapp || '-'}</p>
            </div>
          </div>
        </td>
        <td class="px-4 py-3.5">
          <p class="text-slate-300 text-sm">${u.nomor_id}</p>
          <p class="text-slate-500 text-xs">${u.nik_pendek || '-'}</p>
        </td>
        <td class="px-4 py-3.5"><p class="text-slate-300 text-sm">${u.kode_departemen || '-'}</p></td>
        <td class="px-4 py-3.5">
          <span class="inline-flex items-center px-2.5 py-1 rounded-lg border text-xs font-medium ${ROLE_COLORS[u.role_sistem] || 'bg-slate-500/20 text-slate-300'}">
            ${u.role_sistem}
          </span>
        </td>
        <td class="px-4 py-3.5">
          <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border text-xs font-medium
            ${u.status_aktif ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30' : 'bg-red-500/20 text-red-300 border-red-500/30'}">
            <span class="w-1.5 h-1.5 rounded-full ${u.status_aktif ? 'bg-emerald-400' : 'bg-red-400'}"></span>
            ${u.status_aktif ? 'Aktif' : 'Non-aktif'}
          </span>
        </td>
        <td class="px-4 py-3.5">
          <div class="flex items-center justify-center gap-2">
            <button onclick="openEdit(${JSON.stringify(u).replace(/"/g,"'")})" title="Edit"
              class="p-2 rounded-lg hover:bg-amber-500/20 text-slate-400 hover:text-amber-300 transition">
              <i class="ph-bold ph-pencil text-base"></i>
            </button>
            <button onclick="deleteUser(${u.id_user}, '${u.nama_lengkap}')" title="Hapus"
              class="p-2 rounded-lg hover:bg-red-500/20 text-slate-400 hover:text-red-300 transition">
              <i class="ph-bold ph-trash text-base"></i>
            </button>
          </div>
        </td>
      </tr>`).join('');
  }

  function openModal() {
    document.getElementById('editId').value = '';
    document.getElementById('modalTitle').textContent = 'Tambah User Baru';
    document.getElementById('userForm').reset();
    document.getElementById('pwdLabel').textContent = '(wajib untuk user baru)';
    document.getElementById('modalUser').classList.remove('hidden');
    document.getElementById('modalUser').classList.add('flex');
  }

  function openEdit(u) {
    document.getElementById('editId').value   = u.id_user;
    document.getElementById('modalTitle').textContent = 'Edit User';
    document.getElementById('f_nomor_id').value = u.nomor_id;
    document.getElementById('f_nik').value      = u.nik_pendek;
    document.getElementById('f_nama').value     = u.nama_lengkap;
    document.getElementById('f_dept').value     = u.kode_departemen;
    document.getElementById('f_jabatan').value  = u.kode_jabatan;
    document.getElementById('f_role').value     = u.role_sistem;
    document.getElementById('f_status').value   = u.status_aktif;
    document.getElementById('f_wa').value       = u.no_whatsapp;
    document.getElementById('f_pwd').value      = '';
    document.getElementById('pwdLabel').textContent = '(kosongkan jika tidak ingin mengubah)';
    document.getElementById('modalUser').classList.remove('hidden');
    document.getElementById('modalUser').classList.add('flex');
  }

  function closeModal() {
    document.getElementById('modalUser').classList.add('hidden');
    document.getElementById('modalUser').classList.remove('flex');
  }

  document.getElementById('userForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const editId = document.getElementById('editId').value;
    const body = {
      nomor_id:        document.getElementById('f_nomor_id').value.trim(),
      nik_pendek:      document.getElementById('f_nik').value.trim(),
      nama_lengkap:    document.getElementById('f_nama').value.trim(),
      kode_departemen: document.getElementById('f_dept').value.trim(),
      kode_jabatan:    document.getElementById('f_jabatan').value.trim(),
      role_sistem:     document.getElementById('f_role').value,
      no_whatsapp:     document.getElementById('f_wa').value.trim(),
      password:        document.getElementById('f_pwd').value,
      status_aktif:    parseInt(document.getElementById('f_status').value),
    };
    if (!editId && !body.password) { showToast('Password wajib diisi untuk user baru', 'warning'); return; }
    const res = editId ? await api.updateUser(editId, body) : await api.createUser(body);
    if (!res?.success) { showToast(res?.message || 'Gagal menyimpan', 'error'); return; }
    showToast(editId ? 'Data user diperbarui' : 'User berhasil dibuat', 'success');
    closeModal(); loadList();
  });

  async function deleteUser(id, nama) {
    showConfirm(`Hapus user <strong>${nama}</strong>? Tindakan ini tidak dapat dibatalkan.`, async () => {
      const res = await api.deleteUser(id);
      if (!res?.success) { showToast(res?.message || 'Gagal', 'error'); return; }
      showToast('User berhasil dihapus', 'success');
      loadList();
    });
  }

  loadList();
</script>
</body>
</html>
